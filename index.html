<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo List</title>
<meta name="theme-color" content="#141b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f6f7f9; --line:#dfe3e9; --line2:#eceff3;
  --text:#18202b; --muted:#667283; --faint:#98a2b0;
  --side:#141b26; --side-text:#97a8bf; --side-strong:#e5ecf5; --side-dim:#55667e;
  --side-hover:rgba(255,255,255,.06); --side-active:rgba(255,255,255,.11);
  --accent:#2f6fdc; --accent-soft:#e8f0fd;
  --doing:#2f6fdc; --wait:#b9740b; --wait-bg:#fff6e5; --wait-line:#f1d39b;
  --done:#1f9d55; --danger:#d14343; --danger-soft:#fdecec;
  --today:#f3f7ff; --shadow:0 12px 40px rgba(16,24,40,.18);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --panel:#161d27; --panel2:#1b2430; --line:#283444; --line2:#1f2935;
    --text:#e3e9f1; --muted:#97a4b6; --faint:#647386;
    --side:#0a0f15; --side-hover:rgba(255,255,255,.05); --side-active:rgba(255,255,255,.09);
    --accent:#5b93f0; --accent-soft:#1a2a45;
    --doing:#5b93f0; --wait:#e0a03a; --wait-bg:#2a2010; --wait-line:#5b4318;
    --done:#3fbf74; --danger:#ef6b6b; --danger-soft:#3a1d1f;
    --today:#152238; --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --panel2:#1b2430; --line:#283444; --line2:#1f2935;
  --text:#e3e9f1; --muted:#97a4b6; --faint:#647386;
  --side:#0a0f15; --side-hover:rgba(255,255,255,.05); --side-active:rgba(255,255,255,.09);
  --accent:#5b93f0; --accent-soft:#1a2a45;
  --doing:#5b93f0; --wait:#e0a03a; --wait-bg:#2a2010; --wait-line:#5b4318;
  --done:#3fbf74; --danger:#ef6b6b; --danger-soft:#3a1d1f;
  --today:#152238; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:flex;height:100%}

/* Sidebar */
aside{width:240px;flex-shrink:0;background:var(--side);color:var(--side-text);overflow-y:auto;padding:16px 10px 40px;display:flex;flex-direction:column;gap:2px}
.brand{color:var(--side-strong);font-weight:600;font-size:15px;padding:2px 8px 6px;display:flex;align-items:center;justify-content:space-between}
.brand small{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--side-dim)}
.nav{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;border:0;background:none;color:var(--side-text);text-align:left;width:100%;font-size:13px}
.nav:hover{background:var(--side-hover);color:var(--side-strong)}
.nav.on{background:var(--side-active);color:var(--side-strong)}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--side-dim)}
.nav .ct.hot{color:#f2b84b}
.nav .ic{width:16px;text-align:center;opacity:.8}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 6px;font-size:11.5px;color:var(--side-dim)}
.side-h button{border:0;background:none;color:var(--side-dim);font-size:16px;line-height:1;padding:0 4px;border-radius:4px}
.side-h button:hover{color:var(--side-strong);background:var(--side-hover)}
.cat-row{font-weight:500}
.cat-row .dot,.proj-row .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.chev{border:0;background:none;color:var(--side-dim);width:16px;padding:0;font-size:10px}
.proj-row{padding-left:30px;font-size:12.5px}
.proj-row .dot{width:5px;height:5px;border-radius:50%;opacity:.8}
.side-add{padding:5px 8px 5px 30px;font-size:12px;color:var(--side-dim);border:0;background:none;text-align:left;width:100%;border-radius:6px}
.side-add:hover{color:var(--side-strong);background:var(--side-hover)}
.side-input{display:flex;flex-direction:column;gap:6px;padding:4px 8px 8px 30px}
.side-input input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:5px 8px;color:var(--side-strong);outline:none;font-size:12.5px}
.side-input .row{display:flex;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#topbar button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 10px}
#scroll{flex:1;overflow-y:auto}
#view{max-width:1200px;margin:0 auto;padding:22px 28px 80px}
#note{display:none;margin:0 0 14px;padding:8px 12px;border-radius:6px;background:var(--wait-bg);border:1px solid var(--wait-line);font-size:12.5px}
#note.show{display:block}

.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.head h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.head .spacer{flex:1}
.title-input{font-size:21px;font-weight:600;border:1px solid transparent;background:none;border-radius:6px;padding:2px 6px;margin-left:-7px;min-width:120px;max-width:100%;letter-spacing:-.01em}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font-size:12.5px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger)}
.btn.warn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:30px;padding:0}

.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sec-h h2{font-size:14px;font-weight:600;margin:0}
.sec-h .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.sec-h .spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* Quick add */
.qadd{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.qadd input{flex:1 1 260px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--panel);outline:none}
.qadd input:focus{border-color:var(--accent)}
.qadd input.qa-date{flex:0 0 auto;padding:6px 8px}
.qadd select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);max-width:220px}

/* Follow-ups */
.fu{background:var(--wait-bg);border:1px solid var(--wait-line);border-radius:10px;padding:10px 14px;margin-top:16px}
.fu-h{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--wait)}
.fu-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--wait-line);flex-wrap:wrap}
.fu-row:first-of-type{border-top:0}
.fu-row .who{font-weight:600}
.fu-row .what{flex:1;min-width:160px;cursor:pointer}
.fu-row .when{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Groups and task rows */
.grp{padding:4px 0}
.grp + .grp{border-top:1px solid var(--line2)}
.grp-h{display:flex;align-items:center;gap:8px;padding:8px 14px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.grp-h .bar{width:3px;height:12px;border-radius:2px}
.grp-h .n{font-family:var(--mono);font-weight:400;color:var(--faint)}
.task{display:flex;align-items:flex-start;gap:10px;padding:7px 14px;position:relative}
.task:hover{background:var(--panel2)}
.task.dragging{opacity:.4}
.chk{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);background:none;margin-top:1px;padding:0;display:grid;place-items:center;color:#fff;font-size:10px;line-height:1}
.chk:hover{border-color:var(--done)}
.chk.doing{border-color:var(--doing);background:linear-gradient(90deg,var(--doing) 50%,transparent 50%)}
.chk.waiting{border-color:var(--wait);border-style:dashed}
.chk.handed{border-style:solid;background:linear-gradient(90deg,var(--wait) 50%,transparent 50%)}
.chip.handed{color:var(--wait);border-color:var(--wait-line);background:var(--wait-bg)}
.chk.done{border-color:var(--done);background:var(--done)}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-title{word-break:break-word}
.task.is-done .t-title{color:var(--faint);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chips:empty{display:none}
.chip{font-size:11px;border-radius:4px;padding:0 6px;line-height:18px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.mono{font-family:var(--mono);font-size:10.5px}
.chip.proj{display:inline-flex;align-items:center;gap:5px}
.chip.proj i{width:6px;height:6px;border-radius:2px;display:inline-block}
.chip.doing{color:var(--doing);border-color:color-mix(in srgb,var(--doing) 35%,transparent);background:color-mix(in srgb,var(--doing) 8%,transparent)}
.chip.wait{color:var(--wait);border-color:var(--wait-line);background:var(--wait-bg)}
.chip.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
.chip.soon{color:var(--wait)}
.chip.who{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.chip.ahead{color:var(--doing)}
.set-row{display:flex;gap:14px 18px;flex-wrap:wrap;margin-top:10px}
.set-row label.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.chip.roll{color:var(--wait);border-style:dashed}
.chip.carry{border-style:dashed}
.t-quick{display:flex;gap:4px;opacity:0;flex-shrink:0}
.task:hover .t-quick,.task:focus-within .t-quick{opacity:1}
.q{border:1px solid var(--line);background:var(--panel);border-radius:5px;font-size:11px;padding:1px 7px;color:var(--muted)}
.q:hover{color:var(--text);border-color:var(--faint)}
.q.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.q-date{font-size:11px;padding:0 4px;height:20px;border:1px solid var(--accent);border-radius:5px;background:var(--panel);color:var(--text);outline:none}
.empty{padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}
.drop-hint{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
[draggable="true"]{cursor:grab}
.ditem.dragging,.kcard.dragging{opacity:.35}
.ord{position:relative}
.grip{display:none}
@media (hover:none){
  .ord > .task, .ord > .step{padding-right:34px}
  .grip{display:flex;align-items:center;justify-content:center;position:absolute;right:0;top:0;width:32px;height:44px;color:var(--faint);font-size:15px;letter-spacing:-3px;touch-action:none;-webkit-user-select:none;user-select:none}
}
.ord.ins-before{box-shadow:inset 0 3px 0 var(--accent)}
.ord.ins-after{box-shadow:inset 0 -3px 0 var(--accent)}
#update-bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--accent);box-shadow:var(--shadow);font-size:13.5px;white-space:nowrap}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.92;box-shadow:var(--shadow);border-radius:8px;background:var(--panel);border:1px solid var(--accent);transform:rotate(1.5deg)}
@media (hover:none){ [data-drag],[data-drag-step]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none} }

/* Days */
.days-wrap{overflow-x:auto;padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1000px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);background:var(--today)}
.day.past{opacity:.85}
.day-h{display:flex;align-items:baseline;gap:6px;padding:8px 10px 6px;border-bottom:1px solid var(--line2)}
.day-h b{font-size:13px}
.day-h span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day-h em{font-style:normal;margin-left:auto;font-size:11px;color:var(--accent);font-weight:600}
.day-list{padding:4px 0;flex:1}
.ditem{display:flex;gap:7px;align-items:flex-start;padding:4px 10px;font-size:12.5px}
.ditem:hover{background:var(--panel2)}
.ditem .chk{width:14px;height:14px;font-size:8px;margin-top:2px;border-width:2px}
.ditem .dt{flex:1;min-width:0;cursor:pointer;word-break:break-word}
.ditem.is-done .dt{color:var(--faint);text-decoration:line-through}
.ditem .cd{width:6px;height:6px;border-radius:2px;margin-top:6px;flex-shrink:0}
.ditem .r{font-family:var(--mono);font-size:10px;color:var(--wait)}
.day-empty{padding:6px 10px;color:var(--faint);font-size:11.5px}

/* Accomplished + notes */
.acc{padding:6px 16px 12px}
.acc-cat{margin-top:8px}
.acc-cat h3{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:0 0 3px}
.acc-cat h3 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.acc-cat ul{margin:0;padding-left:22px}
.acc-cat li{font-size:13px;padding:1px 0}
.acc-cat li span{color:var(--muted)}
textarea.notes{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;outline:none;line-height:1.55}
textarea.notes:focus{border-color:var(--accent)}

/* Log */
.wk{margin-bottom:12px}
.wk-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer;flex-wrap:wrap}
.wk-h b{font-size:14px}
.wk-h .spacer{flex:1}
.wk-note{padding:8px 16px 0;color:var(--muted);font-size:12.5px;white-space:pre-wrap}

/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(10,15,22,.35);display:none;z-index:40}
#scrim.show{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s ease;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.dr-h .crumb{margin:0;flex:1}
.dr-b{flex:1;overflow-y:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:16px}
.dr-title{width:100%;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);resize:none;min-height:42px;outline:none}
.dr-title:focus{border-color:var(--accent)}
.lbl{font-size:11.5px;color:var(--muted);margin-bottom:5px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:6px 4px;font-size:12.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.w{background:var(--wait)}
.seg button.on.d{background:var(--done)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.wbox{background:var(--wait-bg);border:1px solid var(--wait-line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wbox .meta{font-size:11.5px;color:var(--muted)}
.cl-item{display:flex;align-items:center;gap:8px;padding:3px 0}
.cl-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--done)}
.cl-item input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;outline:none}
.cl-item input[type=text]:focus{border-bottom-color:var(--accent)}
.cl-item.done input[type=text]{color:var(--faint);text-decoration:line-through}
.cl-item .x{border:0;background:none;color:var(--faint);font-size:14px;padding:0 4px}
.cl-item .x:hover{color:var(--danger)}
.cl-add{width:100%;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;background:none;outline:none;margin-top:4px}
.cl-add:focus{border-style:solid;border-color:var(--accent)}
.ms-qadd{display:block;width:calc(100% - 28px);margin:6px 14px 12px;border:1px dashed var(--line);border-radius:6px;padding:7px 10px;background:none;outline:none;color:var(--text);font-size:13px}
.ms-qadd:focus{border-style:solid;border-color:var(--accent);background:var(--panel)}
.dr-notes{width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);resize:vertical;outline:none}
.dr-notes:focus{border-color:var(--accent)}
.check-line{display:flex;align-items:center;gap:8px;font-size:13px}

/* Quick capture */
.prev{font-size:12px;color:var(--muted);padding:6px 4px 0;display:flex;flex-direction:column;gap:2px}
.prev:empty{display:none}
.prev b{color:var(--text);font-weight:500}
.prev .to{color:var(--accent)}
.cap{max-width:560px;margin:8px auto 0}
.cap h1{font-size:21px;margin:0 0 4px}
.cap textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);outline:none;resize:vertical;font-size:16px;line-height:1.5}
.cap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cap .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cap .btn.pri{padding:9px 20px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.hint code{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
#fab{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;line-height:1;box-shadow:var(--shadow);z-index:30}

/* Milestones */
.ms{margin-top:14px;overflow:hidden}
.ms.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ms-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}

</div>

<div id="scrim" onclick="closeOverlays()"></div>
<div id="drawer" aria-hidden="true"></div>

<script>
/* ============ Dates ============ */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const weekStart = () => (M.meta && M.meta.weekStart === 1) ? 1 : 0;   // 0 = Sunday (default), 1 = Monday
const weekOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() - weekStart() + 7) % 7)); return ymd(d); };
// Stored week dates may come from either convention; read them by their midweek day
const normW = w => w ? weekOf(addDays(w, 3)) : '';
const hasWeek = (t, W) => (t.weeks || []).some(w => normW(w) === W);
const dayName = d => DOW[(parse(d).getDay() + 6) % 7];
const curWeek = () => weekOf(today());
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const dayDiff = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function rel(s){
  const n = dayDiff(today(), s);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 1 && n < 7) return DOW[(parse(s).getDay()+6)%7];
  return short(s);
}
function weekLabel(w){
  const e = addDays(w,6), a = parse(w), b = parse(e);
  const left = `${MON[a.getMonth()]} ${a.getDate()}`;
  const right = a.getMonth()===b.getMonth() ? `${b.getDate()}` : `${MON[b.getMonth()]} ${b.getDate()}`;
  return `${left}–${right}, ${b.getFullYear()}`;
}

/* ============ Model ============ */
const PALETTE = ['#0e9f8e','#2f6fdc','#c27c0e','#8a5cf5','#d14d72','#4b8a2f','#6b7a90'];
const M = { meta:null, tasks:new Map(), weeks:new Map() };
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone = o => JSON.parse(JSON.stringify(o));

const cats = () => M.meta?.categories || [];
const projs = () => M.meta?.projects || [];
const catById = id => cats().find(c => c.id === id);
const projById = id => projs().find(p => p.id === id);
const taskCat = t => catById(t.cat) || catById(projById(t.project)?.cat);
const tasks = () => [...M.tasks.values()];
const msList = p => (p && p.milestones) || [];
const msById = (t) => msList(projById(t.project)).find(m => m.id === t.milestone);
function currentMs(p){ return msList(p).find(m => !m.done); }
function msStats(p, m){ const l = tasks().filter(t => t.project === p.id && t.milestone === m.id); return { total:l.length, done:l.filter(t => t.status === 'done').length, list:l }; }

const handedDate = t => t.status !== 'waiting' ? '' : (t.handedOff || statusSince(t)?.d || '0000-00-00');
// Waiting = your part is done. It's "parked" (out of the way) except on its ping date, when it's an action again
const parked = t => t.status === 'waiting' && !(t.pingBy && t.pingBy <= today() && handedDate(t) < today());
// Waiting with the next ping in a later week: off this week's lists until that week comes
const pingLater = t => t.status === 'waiting' && t.pingBy && t.pingBy > today() && weekOf(t.pingBy) > curWeek();
function effDay(t){
  if (t.status === 'done') return t.doneDate || '';
  if (t.status === 'waiting'){ const td = today(), h = handedDate(t); if (pingLater(t)) return ''; if (h === td) return td; return t.pingBy && t.pingBy <= td ? td : ''; }
  if (!t.day) return '';
  const td = today();
  return t.day < td ? td : t.day;
}
// Multi-day blocks: a task planned for t.day can be blocked off through t.dayTo
const blockLen = t => t.day && t.dayTo && t.dayTo > t.day ? dayDiff(t.day, t.dayTo) + 1 : 1;
function blockEnd(t){ const s = effDay(t); if (!s || t.status === 'done' || !t.dayTo || t.status === 'waiting') return s; return t.dayTo > s ? t.dayTo : s; }
function onDay(t, d){ if (!isOpen(t)) return false; const s = effDay(t); return !!s && d >= s && d <= blockEnd(t); }
function blockPos(t, d){ const len = blockLen(t); if (len < 2 || t.status === 'done') return null; const n = dayDiff(t.day, d) + 1; return n >= 1 && n <= len ? { n, of: len } : null; }
const rolled = t => t.status !== 'done' && t.day && t.day < today() && !(t.dayTo && t.dayTo >= today());
function effWeek(t){
  if (t.status === 'done') return t.doneDate ? weekOf(t.doneDate) : '';
  if (pingLater(t)) return weekOf(t.pingBy);
  const d = effDay(t); if (d) return weekOf(d);
  if (!t.week) return '';
  const cw = curWeek(), w = normW(t.week); return w < cw ? cw : w;
}
const stepsOf = t => t.checklist || [];
function sDay(c){ if (c.done) return c.doneDate || ''; if (!c.day) return ''; const td = today(); return c.day < td ? td : c.day; }
function sWeek(c){ if (c.done) return c.doneDate ? weekOf(c.doneDate) : ''; const d = sDay(c); if (d) return weekOf(d); if (!c.week) return ''; const cw = curWeek(), w = normW(c.week); return w < cw ? cw : w; }
const sRolled = c => !c.done && c.day && c.day < today();
function allSteps(){ const out = []; for (const t of M.tasks.values()) for (const c of stepsOf(t)) if (isOpen(t) || c.done) out.push({ t, c }); return out; }
function findStep(tid, sid){ const t = M.tasks.get(tid); const c = t && stepsOf(t).find(x => x.id === sid); return c ? { t, c } : null; }
const pingDue = t => t.status === 'waiting' && t.pingBy && t.pingBy <= today();
const notDone = t => t.status !== 'done';
// Open and part of your active work: tasks in archived projects are left out of Today, This week, suggestions, deadlines, counts
const isOpen = t => t.status !== 'done' && !projById(t.project)?.archived;

/* Deadlines: when a deadline starts showing up, and calendar alerts */
const LEAD_PRESETS = [1,2,3,5,7,10,14,21,30,45,60,90,120,180];
const LEAD_NAMES = { 7:'1 week', 14:'2 weeks', 21:'3 weeks', 28:'4 weeks', 30:'1 month', 60:'2 months', 90:'3 months', 120:'4 months', 180:'6 months', 365:'1 year' };
const leadLabel = n => n === 0 ? 'the same day' : n === 1 ? '1 day' : LEAD_NAMES[n] || n + ' days';
const leadNum = v => { if (v === '' || v == null) return null; const n = Math.round(+v); return Number.isFinite(n) ? Math.max(0, Math.min(365, n)) : null; };
const defLead = () => leadNum(M.meta?.leadDays) ?? 1;
const leadOf = t => leadNum(t.lead) ?? defLead();
// Who: '' means me; otherwise the person doing it (a student or collaborator)
// A goal can be assigned to someone; its tasks are theirs unless the task says otherwise ('me' keeps it mine)
const goalWho = t => { const m = msById(t); return m && m.who ? m.who : ''; };
const whoOf = t => { const w = (t.who || '').trim(); if (w.toLowerCase() === 'me') return ''; return w || goalWho(t); };
const mine = t => !whoOf(t);
function people(){ const m = new Map(); const add = w => { w = (w || '').trim(); if (w && w.toLowerCase() !== 'me' && !m.has(w.toLowerCase())) m.set(w.toLowerCase(), w); };
  for (const t of M.tasks.values()) add(whoOf(t)); for (const p of projs()) for (const g of msList(p)) add(g.who); return [...m.values()].sort((a,b) => a.localeCompare(b)); }
function canonPerson(v){ v = (v || '').trim().replace(/^@/, ''); if (!v || /^(me|myself)$/i.test(v)) return ''; return people().find(p => p.toLowerCase() === v.toLowerCase()) || (v[0].toUpperCase() + v.slice(1)); }
// A goal's deadline applies to all its tasks; a task keeps its own date if that is earlier
const goalDue = t => { const m = msById(t); return m && !m.done && m.due ? m.due : ''; };
const effDue = t => { const g = goalDue(t); return !t.due ? g : !g ? t.due : (g < t.due ? g : t.due); };
const dueFromGoal = t => { const g = goalDue(t); return !!g && (!t.due || g < t.due); };
const showFrom = t => effDue(t) ? addDays(effDue(t), -leadOf(t)) : '';
const surfaced = (t, D) => isOpen(t) && !!effDue(t) && (D || today()) >= showFrom(t);
const calAlerts = () => ({ start:true, week:true, day:true, on:false, people:true, pings:true, ...(M.meta?.calAlerts || {}) });
function dueIn(d){
  const n = dayDiff(today(), d);
  if (n < 0) return 'overdue ' + (-n) + (n === -1 ? ' day' : ' days');
  if (n === 0) return 'today'; if (n === 1) return 'tomorrow';
  if (n < 14) return 'in ' + n + ' days';
  if (n < 60) return 'in ' + Math.round(n/7) + ' wk';
  return 'in ' + Math.round(n/30.4) + ' mo';
}

/* Repeating tasks: finishing one adds the next, on the next date after today */
const REPEATS = [['daily','Every day'],['weekdays','Every weekday (Mon–Fri)'],['weekly','Every week'],['2weeks','Every 2 weeks'],['monthly','Every month'],['yearly','Every year']];
const REPEAT_SHORT = { daily:'daily', weekdays:'weekdays', weekly:'weekly', '2weeks':'every 2 wks', monthly:'monthly', yearly:'yearly' };
function addMonthsClamp(s, n){ const d = parse(s), day = d.getDate(); const x = new Date(d.getFullYear(), d.getMonth() + n, 1); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return ymd(x); }
function repStep(s, rep, k){
  if (rep === 'daily') return addDays(s, k);
  if (rep === 'weekly') return addDays(s, 7 * k);
  if (rep === '2weeks') return addDays(s, 14 * k);
  if (rep === 'monthly') return addMonthsClamp(s, k);
  if (rep === 'yearly') return addMonthsClamp(s, 12 * k);
  if (rep === 'weekdays'){ let d = s; for (let i = 0; i < k; i++){ do d = addDays(d, 1); while (parse(d).getDay() === 0 || parse(d).getDay() === 6); } return d; }
  return s;
}
// Where the next copy goes: its planned day (if it had one), its deadline (if it had one), each moved forward together
function repNext(t){
  if (!t.repeat || !REPEAT_SHORT[t.repeat]) return null;
  const td = today(), anchor = t.day || t.due || td;
  let k = 1; while (repStep(anchor, t.repeat, k) <= td && k < 2000) k++;
  const out = { day: '', due: '' };
  if (t.day || !t.due) out.day = repStep(anchor, t.repeat, k);
  if (t.due) out.due = repStep(t.due, t.repeat, k);
  return out;
}
function spawnNext(t){
  if (t.spawned && M.tasks.has(t.spawned)) return null;   // already made (finished, reopened, finished again)
  const nx = repNext(t); if (!nx) return null;
  const n = clone(t); delete n._u;
  Object.assign(n, { id: uid('t'), status: 'todo', doneDate: '', created: new Date().toISOString(), statusLog: [], handedOff: '', pingBy: '', pingCount: 0, lastPing: '', spawned: '', waitingOn: '', autoWk: '',
    day: nx.day, due: nx.due || '', dayTo: nx.day && t.day && t.dayTo > t.day ? addDays(nx.day, dayDiff(t.day, t.dayTo)) : '' });
  n.week = n.day ? weekOf(n.day) : ''; n.weeks = n.week ? [n.week] : [];
  n.checklist = stepsOf(t).map(c => ({ ...c, id: uid('k'), done: false, doneDate: '', day: '', week: '', time: '' }));
  t.spawned = n.id;
  stamp(n); M.tasks.set(n.id, n);
  return n;
}
/* Time estimates (minutes) */
function parseDur(v){
  v = String(v || '').trim().toLowerCase().replace(/^[~≈]\s*/, '');
  if (!v) return 0;
  let m;
  if ((m = v.match(/^(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)\s*(?:(\d+)\s*(?:m|min|mins|minutes?)?)?$/))) return Math.round(+m[1] * 60 + +(m[2] || 0));
  if ((m = v.match(/^(\d+)\s*(?:m|min|mins|minutes?)$/))) return +m[1];
  if ((m = v.match(/^(\d+):(\d{2})$/))) return +m[1] * 60 + +m[2];
  if ((m = v.match(/^(\d+(?:\.\d+)?)$/))) return +m[1] <= 12 ? Math.round(+m[1] * 60) : Math.round(+m[1]);   // a bare number: up to 12 means hours
  return null;
}
const fmtDur = n => !n ? '' : n < 60 ? n + 'm' : Math.floor(n / 60) + 'h' + (n % 60 ? ' ' + (n % 60) + 'm' : '');
const dayCap = () => Math.round((+M.meta?.dayHours || 6) * 60);
const estOn = t => t.est ? Math.round(t.est / blockLen(t)) : 0;
function dayLoad(D){ let n = 0; for (const t of M.tasks.values()) if (mine(t) && isOpen(t) && onDay(t, D) && !parked(t)) n += estOn(t); return n; }
function loadTag(D, brief){
  const n = dayLoad(D); if (!n) return '';
  const over = n > dayCap();
  return `<span class="load ${over ? 'over' : ''}" title="${over ? 'More than the ' + fmtDur(dayCap()) + ' you said you can plan in a day (change it in Sync &amp; backup)' : 'Estimated time for the tasks planned'}">≈ ${fmtDur(n)}${brief ? '' : ' of ' + fmtDur(dayCap())}</span>`;
}
/* Overdue tasks join this week's list on their own (if turned on); taking one off keeps it off for the week */
function autoWeekOverdue(){
  if (!M.meta?.autoOverdue) return;
  const cw = curWeek(), td = today();
  for (const t of M.tasks.values()){
    if (!isOpen(t) || !mine(t) || t.status === 'waiting' || !effDue(t) || effDue(t) > td || effWeek(t) || t.autoWk === cw) continue;
    t.week = cw; if (!hasWeek(t, cw)) t.weeks = [...(t.weeks || []), cw]; t.autoWk = cw; saveTask(t);
  }
}

/* ============ Storage: local first, synced to a private GitHub repo ============ */
const APP_VERSION = 'todo-v38';   // keep in step with VERSION in sw.js
const LS_KEY = 'lt_state_v1', LS_GH = 'lt_github', LS_DIRTY = 'lt_dirty', LS_LAST = 'lt_lastsync';
let ready = false;
M.deleted = {};
let ver = 0;                       // bumps on every local change
const SYNC = { state:'idle', msg:'', last:+(localStorage.getItem(LS_LAST) || 0), running:false, again:false, timer:null };

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function ghCfg(){ try { return JSON.parse(lsGet(LS_GH) || 'null'); } catch(e){ return null; } }

function snapshot(){
  return { meta: M.meta ? clone(M.meta) : null, tasks: tasks().map(clone), notes: [...M.weeks.values()].map(clone), deleted: { ...M.deleted } };
}
function loadState(st){
  M.meta = st.meta || null;
  M.tasks = new Map((st.tasks || []).map(t => [t.id, t]));
  M.weeks = new Map((st.notes || st.weeks || []).map(w => [w.id, w]));
  M.deleted = st.deleted || {};
}
function persist(){
  ver++;
  lsSet(LS_KEY, JSON.stringify(snapshot()));
  lsSet(LS_DIRTY, '1');
  scheduleSync(4000);
}
function loadLocal(){
  try { const d = JSON.parse(lsGet(LS_KEY) || 'null'); if (d) loadState(d); } catch(e){}
}
const stamp = o => { o._u = Date.now(); return o; };
const saveTask = t => { stamp(t); M.tasks.set(t.id, t); persist(); };
const saveMeta = () => { if (M.meta) stamp(M.meta); persist(); };
const saveWeek = w => { stamp(w); M.weeks.set(w.id, w); persist(); };
function removeTask(id){ M.tasks.delete(id); M.deleted[id] = Date.now(); persist(); }

/* merge two states record by record; newest edit wins, deletions win over older edits */
function mergeStates(a, b){
  const pick = (x, y) => !x ? y : !y ? x : ((y._u || 0) > (x._u || 0) ? y : x);
  const deleted = { ...(a.deleted || {}) };
  for (const [id, ts] of Object.entries(b.deleted || {})) deleted[id] = Math.max(deleted[id] || 0, ts);
  const mergeList = (la, lb) => {
    const ma = new Map((la || []).map(r => [r.id, r])), mb = new Map((lb || []).map(r => [r.id, r]));
    const out = [];
    for (const id of new Set([...ma.keys(), ...mb.keys()])){
      const r = pick(ma.get(id), mb.get(id));
      if (deleted[id] && deleted[id] >= (r._u || 0)) continue;
      out.push(r);
    }
    return out.sort((x, y) => x.id < y.id ? -1 : 1);
  };
  return { meta: pick(a.meta, b.meta), tasks: mergeList(a.tasks, b.tasks), notes: mergeList(a.notes, b.notes), deleted };
}
const canon = st => JSON.stringify({ meta: st.meta, tasks: [...(st.tasks||[])].sort((x,y) => x.id < y.id ? -1 : 1), notes: [...(st.notes||[])].sort((x,y) => x.id < y.id ? -1 : 1), deleted: st.deleted || {} });

/* GitHub contents API */
function b64encode(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64decode(b64){ const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function ghHeaders(cfg, accept){ return { 'Authorization': 'Bearer ' + cfg.token, 'Accept': accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; }
function ghUrl(cfg){ return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`; }
class GhError extends Error { constructor(msg, kind){ super(msg); this.kind = kind; } }
async function ghCheckRepo(cfg){
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, { headers: ghHeaders(cfg), cache:'no-store' });
  if (r.status === 401) throw new GhError('GitHub didn’t accept the token (401). Check that you copied all of it, with no spaces at the start or end, and that it hasn’t expired.', 'auth');
  if (r.status === 404 || r.status === 403) throw new GhError('GitHub says it can’t find ' + cfg.owner + '/' + cfg.repo + ' for this token (' + r.status + '). Check the spelling, and that when you made the token you chose “Only select repositories” and picked ' + cfg.repo + '.', 'auth');
  if (!r.ok) throw new GhError('GitHub returned an error (' + r.status + ').', 'net');
  const j = await r.json();
  if (!j.private) throw new GhError('That repository is public, so anyone could read your tasks. Make it private on GitHub (Settings › Danger zone › Change visibility), then connect again.', 'public');
  return j;
}
async function ghGet(cfg){
  const r = await fetch(ghUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch), { headers: ghHeaders(cfg), cache:'no-store' });
  if (r.status === 404) return { state:null, sha:null };
  if (r.status === 401) throw new GhError('GitHub rejected the token. It may have expired; make a new one and reconnect.', 'auth');
  if (r.status === 403) throw new GhError('GitHub refused access (403). The token may lack “Contents: read and write” on this repo, or you hit a rate limit.', 'auth');
  if (!r.ok) throw new GhError('Couldn’t read from GitHub (' + r.status + ').', 'net');
  const j = await r.json();
  let text;
  if (j.content && j.encoding === 'base64') text = b64decode(j.content);
  else {
    const rr = await fetch(ghUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch), { headers: ghHeaders(cfg, 'application/vnd.github.raw'), cache:'no-store' });
    if (!rr.ok) throw new GhError('Couldn’t read the data file (' + rr.status + ').', 'net');
    text = await rr.text();
  }
  let state;
  try { state = JSON.parse(text); } catch(e){ throw new GhError('The data file on GitHub isn’t valid JSON. Fix or delete it there, then sync again.', 'data'); }
  return { state: { meta: state.meta || null, tasks: state.tasks || [], notes: state.notes || [], deleted: state.deleted || {} }, sha: j.sha };
}
async function ghPut(cfg, state, sha){
  const body = { message: 'Update ' + new Date().toISOString().slice(0,16).replace('T',' '), content: b64encode(JSON.stringify({ app:'todo-list', version:1, saved:new Date().toISOString(), ...state }, null, 1)), branch: cfg.branch };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(cfg), { method:'PUT', headers: { ...ghHeaders(cfg), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return 'conflict';
  if (r.status === 401) throw new GhError('GitHub rejected the token. It may have expired; make a new one and reconnect.', 'auth');
  if (r.status === 403) throw new GhError('GitHub refused to save (403). The token needs “Contents: read and write” on this repo.', 'auth');
  if (r.status === 404) throw new GhError('GitHub couldn’t find the repo or branch to save into. Check the branch name (usually “main”) and that the repo isn’t empty.', 'auth');
  if (!r.ok) throw new GhError('Couldn’t save to GitHub (' + r.status + ').', 'net');
  return 'ok';
}

function scheduleSync(ms){
  clearTimeout(SYNC.timer);
  if (!ghCfg()) return;
  SYNC.timer = setTimeout(() => sync(), ms);
}
function setSync(state, msg){ SYNC.state = state; SYNC.msg = msg || ''; const el = document.getElementById('sync-pill'); if (el) el.outerHTML = syncPill(); if (UI.view === 'sync') requestRender(); }
async function sync(){
  const cfg = ghCfg(); if (!cfg) return;
  if (SYNC.running){ SYNC.again = true; return; }
  if (!navigator.onLine){ setSync('offline'); return; }
  SYNC.running = true; setSync('syncing');
  try {
    for (let attempt = 0; attempt < 4; attempt++){
      const startVer = ver;
      const remote = await ghGet(cfg);
      const local = snapshot();
      const merged = remote.state ? mergeStates(local, remote.state) : local;
      const needPush = !remote.state || canon(merged) !== canon(remote.state);
      // fold in anything changed on screen while we were waiting
      const current = ver === startVer ? merged : mergeStates(snapshot(), merged);
      if (canon(current) !== canon(local)){ loadState(current); lsSet(LS_KEY, JSON.stringify(current)); requestRender(); }
      if (needPush){
        const res = await ghPut(cfg, merged, remote.sha);
        if (res === 'conflict') continue;

}
function accList(list, steps){
  steps = steps || [];
  const stepTasks = steps.map(x => x.t);
  return groupByCat([...new Set([...list, ...stepTasks])]).map(g => {
    const gt = g.items.filter(t => list.includes(t));

    const gsIn = steps.filter(x => g.items.includes(x.t) && list.includes(x.t));
    return `<div class="acc-cat"><h3><i style="background:${g.cat.color}"></i>${esc(g.cat.name)} <span class="n" style="font-family:var(--mono);font-weight:400;color:var(--faint)">${gt.length + gs.length}</span></h3><ul>` +
      gt.map(t => `<li>${esc(t.title)}${projById(t.project) ? ` <span>(${esc(projById(t.project).name)})</span>` : ''}${gsIn.filter(x => x.t === t).length ? `<span>, incl. ${gsIn.filter(x => x.t === t).map(x => esc(x.c.text)).join(', ')}</span>` : ''}</li>`).join('') +
      gs.map(({t,c}) => `<li>${esc(c.text)} <span>(step of ${esc(t.title)})</span></li>`).join('') + `</ul></div>`;
  }).join('');
}

function renderToday(){
  const td = today(), D = UI.day || td, isPast = D < td, isToday = D === td;

  const planned = all.filter(t => isOpen(t) ? onDay(t, D) : t.doneDate === D);
  const openP = sortTasks(planned.filter(isOpen)), doneP = planned.filter(t => !isOpen(t));
  const daySteps = allSteps().filter(({t,c}) => mine(t) && (c.done ? c.doneDate === D : (isOpen(t) && sDay(c) === D)));
  const flatSteps = daySteps.filter(x => !openP.includes(x.t));
  const flatOpen = flatSteps.filter(x => !x.c.done), flatDone = flatSteps.filter(x => x.c.done);
  const totalN = planned.length + daySteps.length, doneN = doneP.length + daySteps.filter(x => x.c.done).length;
  const handedN = planned.filter(t => t.status === 'waiting' && handedDate(t) === D).length;

  const title = isToday ? 'Today' : D === addDays(td,1) ? 'Tomorrow' : D === addDays(td,-1) ? 'Yesterday' : dname + ' ' + short(D);
  const pct = totalN ? Math.round(100 * (doneN + handedN / 2) / totalN) : 0;

  let h = `<div class="head">
      <button class="icon-btn" data-act="day-prev" aria-label="Previous day">‹</button>

    <div class="sub">${longDate}</div>
    ${focusOf(weekOf(D)).length ? `<div class="focus-strip">★ This week: ${focusOf(weekOf(D)).map(k => `<button class="fchip on" data-act="nav" data-v="proj" data-id="${focusParts(k).p.id}">${k.startsWith('g:') ? '⚑ ' : ''}${esc(focusLabel(k))}</button>`).join('')}</div>` : ''}
    ${totalN ? `<div class="prog"><span class="bar"><i style="width:${pct}%"></i></span>${doneN} of ${totalN} done${handedN ? `, ${handedN} handed off` : ''}</div>` : ''}`;

  if (isToday){
    const fu = all.filter(t => pingDue(t) && !onDay(t, D));
    if (fu.length) h += `<div class="fu" style="margin-top:0;margin-bottom:16px"><div class="fu-h">Follow up today</div>` + fu.map(t => `<div class="fu-row">
        <span class="who">${esc(t.waitingOn || 'Someone')}</span>
        <span class="what" data-act="open" data-id="${t.id}">${esc(t.title)}</span>
        <button class="btn" data-act="pinged" data-id="${t.id}">${pingBtn(t)}</button>
        <button class="btn" data-act="done" data-id="${t.id}">Resolved</button></div>`).join('') + `</div>`;
  }

  // left: the day's list
  let left = '';
  if (!isPast) left += quickAdd(`<option value="${D}">${isToday ? 'Today' : dname}</option><option value="week">This week</option><option value="none">No date</option>`);
  left += `<div class="sec" style="margin-top:${isPast?0:16}px"><div class="sec-h"><h2>${isPast ? 'Done that day' : 'Plan'}</h2><span class="n">${isPast ? doneN : (openP.length + flatOpen.length) + ' to do'}</span>${isPast ? '' : loadTag(D)}${!isPast && dayOrder(D).length ? `<span class="spacer"></span><button class="q" data-act="ord-reset" data-d="${D}" title="Go back to ordering by time and project">Reset order</button>` : ''}</div><div class="card" data-drop="${D}" data-order-day="${D}">`;
  if (isPast) left += doneN ? doneP.map(t => taskRow(t,'today')).join('') + daySteps.filter(x => x.c.done).map(({t,c}) => stepRow(t, c, true, 'today')).join('') : `<div class="empty">Nothing was marked done.</div>`;
  else {
    const catIdx = t => { const c = taskCat(t); const i = cats().indexOf(c); return i < 0 ? 99 : i; };
    const entries = [...openP.map(t => ({ t, c:null })), ...flatOpen].sort((a,b) => (timeStart(a.c ? a.c.time : a.t.time) - timeStart(b.c ? b.c.time : b.t.time)) || (catIdx(a.t) - catIdx(b.t)) || ((a.t.project||'') < (b.t.project||'') ? -1 : (a.t.project||'') > (b.t.project||'') ? 1 : 0) || (a.c ? 1 : 0) - (b.c ? 1 : 0));
    const ordKey = e => e.c ? 's:' + e.t.id + '|' + e.c.id : 't:' + e.t.id;

    }

  }
  left += `</div></div>`;
  if (!isPast) left += goalsSec(D);
  if (!isPast) left += deadlinesSec(all.filter(t => surfaced(t, D) && !onDay(t, D)));
  if (!isPast) left += peopleSec(tasks().filter(t => !mine(t) && isOpen(t) && (surfaced(t, D) || (effDay(t) && effDay(t) <= D))));

  if (isPast) return h + left;
  return h + `<div class="today-grid"><div>${left}</div><div class="picker">${renderPicker(D)}</div></div>`;
}

function deadlinesSec(list, cls){
  if (!list.length) return '';
  const td = today();
  const buckets = [['Overdue', n => n < 0], ['This week', n => n <= 7], ['Next 2 weeks', n => n <= 14], ['Later', () => true]];
  const byB = buckets.map(() => []);
  for (const t of list){ const n = dayDiff(td, effDue(t)); byB[buckets.findIndex(([, f]) => f(n))].push(t); }
  let body = '';
  buckets.forEach(([name], i) => {
    const ts = byB[i]; if (!ts.length) return;
    ts.sort((a, b) => effDue(a) < effDue(b) ? -1 : effDue(a) > effDue(b) ? 1 : 0);
    // tasks that only share their goal's deadline collapse into one goal row
    const groups = new Map(), rows = [];
    for (const t of ts){
      if (dueFromGoal(t)){ const k = t.project + '|' + t.milestone; if (!groups.has(k)){ groups.set(k, []); rows.push({ goal: k }); } groups.get(k).push(t); }
      else rows.push({ t });
    }
    body += `<div class="grp"><div class="grp-h ${i === 0 ? 'late' : ''}">${name}<span class="n">${ts.length}</span></div>`;
    for (const r of rows){
      if (r.t){ body += taskRowOnly(r.t, 'due'); continue; }
      const g = groups.get(r.goal), t0 = g[0], m = msById(t0), p = projById(t0.project), dd = effDue(t0), n = dayDiff(td, dd);
      if (g.length === 1){ body += taskRowOnly(t0, 'due'); continue; }
      const key = 'dg:' + r.goal, open = UI.openPick.has(key);
      body += `<div class="task goal-row"><span class="g-flag">⚑</span><div class="t-main" data-act="pick-toggle" data-id="${key}"><div class="t-title">${esc(m.name)}</div>
        <div class="chips">${projChip(t0)}<span class="chip mono ${n < 0 ? 'late' : n <= 2 ? 'soon' : n <= 7 ? 'ahead' : ''}">due ${rel(dd)}${n > 6 || n < 0 ? ' · ' + dueIn(dd) : ''}</span><span class="chip mono">${g.length} tasks ${open ? '▾' : '▸'}</span></div></div></div>`;
      if (open) body += `<div class="dg-tasks">${g.map(t => taskRowOnly(t, 'due')).join('')}</div>`;
    }
    body += `</div>`;
  });
  return `<div class="sec ${cls||''}"><div class="sec-h"><h2>Deadlines coming up</h2><span class="n">${list.length}</span><span class="spacer"></span><span class="n">${defLead() ? esc(leadLabel(defLead())) + ' ahead' : 'on the day'}</span></div>
    <div class="card">${body}</div></div>`;
}
function peopleSec(list, cls){
  if (!list.length) return '';
  const groups = new Map();
  for (const t of sortTasks(list)){ const w = whoOf(t); if (!groups.has(w)) groups.set(w, []); groups.get(w).push(t); }
  let h = `<div class="sec ${cls||''}"><div class="sec-h"><h2>People</h2><span class="n">${list.length}</span><span class="spacer"></span><button class="q" data-act="nav" data-v="people">All people ›</button></div><div class="card">`;
  for (const [w, ts] of [...groups].sort((a,b) => a[0].localeCompare(b[0]))) h += `<div class="grp"><div class="grp-h">👤 ${esc(w)}<span class="n">${ts.length}</span></div>${ts.map(t => taskRowOnly(t, 'people')).join('')}</div>`;
  return h + `</div></div>`;
}

// My unfinished tasks and steps planned for the current week (they roll into next week when it starts)
// Manual order of a day's plan (keys 't:<task>' or 's:<task>|<step>'), saved with the day's notes record
function dayOrder(D){ return M.weeks.get('d-' + D)?.order || []; }
function setDayOrder(D, keys){ const d = M.weeks.get('d-' + D) || { kind:'day', id:'d-' + D, note:'' }; d.order = keys; saveWeek(d); }
// Goals: show up from their lead time before the due date, or on their check-in date (until dismissed)
const goalLead = m => leadNum(m.lead) ?? defLead();
const goalDueSoon = (m, D) => !m.done && !!m.due && (D || today()) >= addDays(m.due, -goalLead(m));
const goalCheckIn = (m, D) => !m.done && !!m.remind && (D || today()) >= m.remind;
const goalSurfaced = (m, D) => goalDueSoon(m, D) || goalCheckIn(m, D);
function allGoals(){ const out = []; for (const p of projs()) if (!p.archived) for (const m of msList(p)) out.push({ p, m }); return out; }
function goalsSec(D, cls){
  const list = allGoals().filter(({m}) => goalSurfaced(m, D));
  if (!list.length) return '';
  list.sort((a, b) => (a.m.due || a.m.remind || '9999') < (b.m.due || b.m.remind || '9999') ? -1 : 1);
  return `<div class="sec ${cls||''}"><div class="sec-h"><h2>Goals</h2><span class="n">${list.length}</span></div><div class="card">${list.map(({p, m}) => {
    const st = msStats(p, m), n = m.due ? dayDiff(today(), m.due) : null;
    const chips = [projChip({ project: p.id })];
    if (m.who) chips.push(`<span class="chip who">👤 ${esc(m.who)}</span>`);
    if (m.due) chips.push(`<span class="chip mono ${n < 0 ? 'late' : n <= 2 ? 'soon' : n <= 7 ? 'ahead' : ''}">due ${rel(m.due)}${n > 6 || n < 0 ? ' · ' + dueIn(m.due) : ''}</span>`);
    if (goalCheckIn(m, D)) chips.push(`<span class="chip mono soon">check-in ${m.remind === today() ? 'today' : rel(m.remind)}</span>`);
    chips.push(`<span class="chip mono">${st.done}/${st.total} tasks</span>`);
    return `<div class="task goal-row"><span class="g-flag">⚑</span>
      <div class="t-main" data-act="nav" data-v="proj" data-id="${p.id}" data-ms="${m.id}"><div class="t-title">${esc(m.name)}</div>${m.desc ? `<div class="g-desc">${esc(m.desc.length > 140 ? m.desc.slice(0, 140) + '…' : m.desc)}</div>` : ''}<div class="chips">${chips.join('')}</div></div>
      <div class="t-quick">${goalCheckIn(m, D) ? `<button class="q" data-act="ms-checked" data-p="${p.id}" data-id="${m.id}" title="Clear the check-in reminder">Done</button>` : ''}<button class="q" data-act="nav" data-v="proj" data-id="${p.id}" data-ms="${m.id}">Open</button></div></div>`;

}
function unfinishedThisWeek(){
  const cw = curWeek();
  const ts = tasks().filter(t => mine(t) && isOpen(t) && effWeek(t) === cw);
  const steps = allSteps().filter(({t,c}) => mine(t) && !c.done && isOpen(t) && sWeek(c) === cw && effWeek(t) !== cw);
  return { tasks: ts, steps };
}
function moveUnfinishedToNextWeek(){
  const nw = addDays(curWeek(), 7), u = unfinishedThisWeek();
  for (const t of u.tasks){

    for (const c of stepsOf(t)) if (!c.done && sWeek(c) === curWeek()){ c.day = ''; c.time = ''; c.week = nw; }
    saveTask(t);
  }
  for (const {t,c} of u.steps){ c.day = ''; c.time = ''; c.week = nw; saveTask(t); }
  return u.tasks.length + u.steps.length;
}
function renderPicker(D){
  const isToday = D === today(), label = isToday ? 'Today' : DOW[(parse(D).getDay()+6)%7];
  const q = UI.pickQ.trim().toLowerCase();

  const match = t => !q || (t.title + ' ' + projLabel(t) + ' ' + (taskCat(t)?.name || '') + ' ' + (msById(t)?.name || '')).toLowerCase().includes(q);
  const used = new Set();
  const pickSteps = t => { const ss = stepsOf(t).filter(c => !c.done && sDay(c) !== D); return ss.length ? `<div class="steps">${ss.map(c => `<div class="step"><button class="schk" data-act="step-toggle" data-id="${t.id}" data-s="${c.id}" aria-label="Mark step done"></button><div class="st-main" data-act="open" data-id="${t.id}"><span class="st-text">${esc(c.text)}</span></div><button class="q add" data-act="step-day" data-id="${t.id}" data-s="${c.id}">+ ${label}</button></div>`).join('')}</div>` : ''; };

  let h = `<div class="sec-h" style="margin-top:0"><h2>Pick for ${isToday ? 'today' : label}</h2><span class="n">from your projects and goals</span></div>
    <div class="card"><input class="pk-search" id="pick-q" placeholder="Search" value="${esc(UI.pickQ)}" autocomplete="off">`;

  // Suggested: rank what most needs attention, and say why
  const W0 = weekOf(D), nextUp = new Set();
  for (const p of projs()){ const cur = currentMs(p); if (!cur) continue; sortTasks(cand.filter(t => t.project === p.id && t.milestone === cur.id)).slice(0, 2).forEach(t => nextUp.add(t.id)); }
  const whyOf = t => {
    const why = []; let score = 0; const dd = effDue(t);
    if (dd){ const n = dayDiff(D, dd);
      if (n < 0){ score = Math.max(score, 100); why.push({ k:'late', txt:'overdue ' + (-n) + (n === -1 ? ' day' : ' days') }); }
      else if (n <= 3){ score = Math.max(score, 90 - n); why.push({ k:'soon', txt:(dueFromGoal(t) ? '⚑ ' : '') + 'due ' + rel(dd) }); }
      else if (surfaced(t, D)){ score = Math.max(score, 55 - Math.min(n, 45) / 3); why.push({ k: n <= 7 ? 'ahead' : '', txt:(dueFromGoal(t) ? '⚑ ' : '') + 'due ' + short(dd) }); } }
    if (pingDue(t)){ score = Math.max(score, 85); why.push({ k:'late', txt:'ping ' + (t.waitingOn || 'them') }); }
    if (t.status === 'doing'){ score = Math.max(score, 75); why.push({ k:'', txt:'in progress' }); }
    if (effWeek(t) === W0){ score = Math.max(score, 70); why.push({ k:'', txt:'this week’s list' }); }
    if (taskFocus(t)){ score = score ? score + 12 : 50; why.unshift({ k:'focus', txt:'★ priority' }); }
    if (t.star){ score = score ? score + 10 : 60; why.unshift({ k:'imp', txt:'! important' }); }
    if (nextUp.has(t.id)){ score = Math.max(score, 45); why.push({ k:'', txt:'next in ⚑ ' + currentMs(projById(t.project)).name }); }
    return { score, why };
  };
  const sugRow = (t, why) => `<div class="pk flat"><div class="t-main"><div class="t-title" data-act="open" data-id="${t.id}">${esc(t.title)}</div><div class="chips" data-act="open" data-id="${t.id}">${projChip(t)}${why.map(w => `<span class="chip mono ${w.k}">${esc(w.txt)}</span>`).join('')}</div>${pickSteps(t)}</div><button class="q add" data-act="pick" data-id="${t.id}">+ ${label}</button></div>`;

      }

    if (loose.length){

      body += `<button class="pk-proj" data-act="pick-toggle" data-id="${key}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}<span class="g">no project</span><span class="n">${loose.length} ${openIt ? '▾' : '▸'}</span></button>`;

  if (inbox.length){

  if (!shown.length && !wkSteps.length && !body) h += `<div class="empty">${q ? 'No tasks match.' : 'Every open task is already on this day.'}</div>`;
  return h + `</div>`;
}

function kcard(t, showProj){
  const meta = [];
  if (t.star && isOpen(t)) meta.push(`<span class="chip imp">! important</span>`);
  if (whoOf(t)) meta.push(`<span class="chip who">👤 ${esc(whoOf(t))}</span>`);
  if (showProj) meta.push(projChip(t));
  if (t.status === 'doing') meta.push(`<span class="chip doing">Doing</span>`);
  if (t.status === 'waiting') meta.push(`<span class="chip wait">⏳ ${esc(t.waitingOn || 'Waiting')}</span>` + (t.pingBy ? `<span class="chip mono ${pingDue(t)?'late':''}">ping ${rel(t.pingBy)}</span>` : ''));
  if (effDue(t) && isOpen(t)){ const n = dayDiff(today(), effDue(t)); meta.push(`<span class="chip mono ${n<0?'late':n<=2?'soon':''}">${dueFromGoal(t) ? '⚑ ' : ''}due ${rel(effDue(t))}</span>`); }
  if (isOpen(t)){
    const d = effDay(t);
    if (d === today()) meta.push(`<span class="chip mono" style="color:var(--accent)">today</span>`);
    else if (d) meta.push(`<span class="chip mono">${rel(d)}</span>`);
    else if (effWeek(t) === curWeek()) meta.push(`<span class="chip mono">this week</span>`);
    const sToday = stepsOf(t).filter(c => !c.done && sDay(c) === today()).length;
    if (sToday && d !== today()) meta.push(`<span class="chip mono" style="color:var(--accent)">${sToday} step${sToday>1?'s':''} today</span>`);
  }
  if (t.est && isOpen(t)) meta.push(`<span class="chip mono">≈ ${fmtDur(t.est)}</span>`);
  if (t.repeat && REPEAT_SHORT[t.repeat]) meta.push(`<span class="chip mono rep">⟳ ${REPEAT_SHORT[t.repeat]}</span>`);
  if (showProj && msById(t)) meta.push(goalChip(t));
  const st = stepsOf(t), sd = st.filter(c => c.done).length;
  return `<div class="kcard s-${t.status}" draggable="true" data-drag="${t.id}">
    <button class="chk ${t.status}" data-act="done" data-id="${t.id}" aria-label="Toggle done">${t.status==='done'?'✓':''}</button>
    <div class="kc-main" data-act="open" data-id="${t.id}">
      <div class="kc-title">${esc(t.title)}</div>
      <div class="kc-meta">${meta.join('')}</div>
      ${st.length ? `<div class="kc-steps"><span class="ms-bar"><i style="width:${Math.round(100*sd/st.length)}%"></i></span>${sd}/${st.length} steps</div>` : ''}
    </div>
  </div>`;
}

function icsEsc(s){ return String(s ?? '').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1'); }
function icsFold(line){
  const enc = new TextEncoder(), out = []; let cur = '', len = 0;

  out.push(cur); return out.join('\r\n');
}
function buildIcs(list, goals, pings){
  const a = calAlerts(), [hh, mm] = (M.meta?.calTime || '09:00').split(':').map(Number), mins = (hh||0)*60 + (mm||0);
  const stampNow = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const url = location.origin + location.pathname;
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Todo List//Deadlines//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Todo deadlines'];
  const say = n => n === 0 ? 'Due today' : n === 1 ? 'Due tomorrow' : 'Due in ' + leadLabel(n);   // n in days
  for (const t of list){
    L.push('BEGIN:VEVENT', 'UID:' + t.id + '@todo-list', 'DTSTAMP:' + stampNow,
      'DTSTART;VALUE=DATE:' + effDue(t).replace(/-/g,''), 'DTEND;VALUE=DATE:' + addDays(effDue(t), 1).replace(/-/g,''),
      'SUMMARY:' + icsEsc('Due: ' + (whoOf(t) ? whoOf(t) + ': ' : '') + t.title), 'DESCRIPTION:' + icsEsc(projLabel(t) + '\n' + url), 'URL:' + url, 'TRANSP:TRANSPARENT');
    const days = new Set();
    if (a.start) days.add(leadOf(t)); if (a.week) days.add(7); if (a.day) days.add(1); if (a.on) days.add(0);
    for (const n of [...days].sort((x,y) => y - x)){
      const off = n * 1440 - mins;
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(say(n) + ': ' + t.title), 'TRIGGER:' + (off > 0 ? '-PT' + off + 'M' : 'PT' + (-off) + 'M'), 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
  for (const t of (pings || [])){
    L.push('BEGIN:VEVENT', 'UID:ping-' + t.id + '@todo-list', 'DTSTAMP:' + stampNow,
      'DTSTART;VALUE=DATE:' + t.pingBy.replace(/-/g,''), 'DTEND;VALUE=DATE:' + addDays(t.pingBy, 1).replace(/-/g,''),
      'SUMMARY:' + icsEsc('Follow up: ' + t.title + (t.waitingOn ? ' (' + t.waitingOn + ')' : '')), 'DESCRIPTION:' + icsEsc(projLabel(t) + '\n' + url), 'URL:' + url, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('Follow up: ' + t.title), 'TRIGGER:PT' + mins + 'M', 'END:VALARM', 'END:VEVENT');
  }
  for (const { p, m } of (goals || [])){
    const who = m.who ? m.who + ': ' : '';
    if (m.due){
      L.push('BEGIN:VEVENT', 'UID:goal-' + m.id + '@todo-list', 'DTSTAMP:' + stampNow,
        'DTSTART;VALUE=DATE:' + m.due.replace(/-/g,''), 'DTEND;VALUE=DATE:' + addDays(m.due, 1).replace(/-/g,''),
        'SUMMARY:' + icsEsc('Goal due: ' + who + m.name), 'DESCRIPTION:' + icsEsc(p.name + (m.desc ? '\n' + m.desc : '') + '\n' + url), 'URL:' + url, 'TRANSP:TRANSPARENT');
      const days = new Set(); if (a.start) days.add(goalLead(m)); if (a.week) days.add(7); if (a.day) days.add(1); if (a.on) days.add(0);
      for (const n of [...days].sort((x,y) => y - x)){ const off = n * 1440 - mins; L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(say(n) + ': goal ' + m.name), 'TRIGGER:' + (off > 0 ? '-PT' + off + 'M' : 'PT' + (-off) + 'M'), 'END:VALARM'); }
      L.push('END:VEVENT');
    }
    if (m.remind){
      L.push('BEGIN:VEVENT', 'UID:goal-checkin-' + m.id + '@todo-list', 'DTSTAMP:' + stampNow,
        'DTSTART;VALUE=DATE:' + m.remind.replace(/-/g,''), 'DTEND;VALUE=DATE:' + addDays(m.remind, 1).replace(/-/g,''),
        'SUMMARY:' + icsEsc('Check in: ' + who + m.name), 'DESCRIPTION:' + icsEsc(p.name + (m.desc ? '\n' + m.desc : '') + '\n' + url), 'URL:' + url, 'TRANSP:TRANSPARENT',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('Check in on goal: ' + m.name), 'TRIGGER:PT' + mins + 'M', 'END:VALARM', 'END:VEVENT');
    }
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function calExport(){
  const list = tasks().filter(t => isOpen(t) && effDue(t) && (calAlerts().people || mine(t)));

/* ============ Search ============ */
function hl(s, words){ if (!words.length) return esc(s); const re = new RegExp('(' + words.map(escRe).join('|') + ')', 'gi'); return String(s).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join(''); }
function renderSearch(){
  const raw = UI.searchQ || '', words = raw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let h = `<div class="head"><h1>Search</h1></div><input class="srch-in" id="search-q" type="search" placeholder="Search tasks, steps, notes, projects, goals, people" value="${esc(raw)}" autocomplete="off" enterkeyhint="search" aria-label="Search">`;
  if (!words.length) return h + `<div class="hint" style="margin-top:0">Searches every task, including finished ones and those in archived projects. Press <code>/</code> anywhere to jump here.</div>`;
  const hay = t => [t.title, t.notes, projLabel(t), taskCat(t)?.name, msById(t)?.name, whoOf(t), t.waitingOn, ...stepsOf(t).map(c => c.text)].filter(Boolean).join('\n').toLowerCase();
  const hits = tasks().filter(t => { const x = hay(t); return words.every(w => x.includes(w)); });
  const snip = t => {
    const tl = t.title.toLowerCase(); if (words.every(w => tl.includes(w))) return '';
    for (const [lbl, text] of [...stepsOf(t).map(c => ['Step', c.text]), ['Notes', t.notes]]){
      if (!text) continue; const low = text.toLowerCase(), i = Math.min(...words.map(w => low.indexOf(w)).filter(n => n >= 0));
      if (!Number.isFinite(i)) continue;
      const a = Math.max(0, i - 40), piece = (a ? '…' : '') + text.slice(a, i + 100).replace(/\s+/g, ' ');
      return `<div class="srch-snip"><b>${lbl}:</b> ${hl(piece, words)}</div>`;
    }
    return '';
  };
  const row = t => taskRowOnly(t, 'search').replace(esc(t.title) + '</div>', () => hl(t.title, words) + '</div>' + snip(t));
  const open = sortTasks(hits.filter(notDone)), done = hits.filter(t => !notDone(t)).sort((a, b) => (b.doneDate || '') < (a.doneDate || '') ? -1 : 1);
  if (!hits.length) return h + `<div class="card"><div class="empty">Nothing matches “${esc(raw.trim())}”.</div></div>`;
  const cap = 80;
  if (open.length) h += `<div class="sec" style="margin-top:0"><div class="sec-h"><h2>Open</h2><span class="n">${open.length}</span></div><div class="card">${open.slice(0, cap).map(row).join('')}${open.length > cap ? `<div class="empty">and ${open.length - cap} more; add another word to narrow it down</div>` : ''}</div></div>`;
  if (done.length) h += `<div class="sec"><div class="sec-h"><h2>Done</h2><span class="n">${done.length}</span></div><div class="card">${done.slice(0, cap).map(row).join('')}${done.length > cap ? `<div class="empty">and ${done.length - cap} more</div>` : ''}</div></div>`;
  return h;
}

/* ============ Copying text (summaries, reports) ============ */
async function copyText(text, what){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch(e2){}
  }
  if (ok) showNote('Copied ' + what + '. Paste it into an email, a message or your notes.');
  else { downloadFile('summary.txt', text, 'text/plain'); showNote('Couldn’t copy here, so it was downloaded as a text file instead.'); }
}
function personSummary(p){
  const td = today(), cut = addDays(td, -14), low = p.toLowerCase();
  const ts = tasks().filter(t => whoOf(t).toLowerCase() === low);
  const open = sortTasks(ts.filter(isOpen));
  const done = ts.filter(t => t.status === 'done' && (t.doneDate || '') >= cut).sort((a, b) => a.doneDate < b.doneDate ? -1 : 1);
  const where = t => { const pr = projById(t.project), m = msById(t); return pr ? ' (' + pr.name + (m ? ', ' + m.name : '') + ')' : ''; };
  const line = t => '- ' + t.title + where(t) + (effDue(t) && t.status !== 'done' ? ', due ' + short(effDue(t)) : '') +
    (t.status === 'doing' ? ' [in progress]' : t.status === 'waiting' ? ' [waiting' + (t.waitingOn ? ' on ' + t.waitingOn : '') + ']' : '') +
    (t.status === 'done' ? ', done ' + short(t.doneDate) : '') +
    stepsOf(t).filter(c => !c.done && t.status !== 'done').map(c => '\n    - ' + c.text).join('');
  const late = open.filter(t => effDue(t) && effDue(t) < td);
  const dated = open.filter(t => effDue(t) && effDue(t) >= td).sort((a, b) => effDue(a) < effDue(b) ? -1 : 1);
  const rest = open.filter(t => !effDue(t));
  const goals = allGoals().filter(({m}) => !m.done && (m.who || '').toLowerCase() === low);
  let s = p + ': where things stand, ' + parse(td).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) + '\n';
  if (goals.length) s += '\nGoals\n' + goals.map(({p: pr, m}) => { const st = msStats(pr, m); return '- ' + m.name + ' (' + pr.name + ')' + (m.due ? ', due ' + short(m.due) : '') + ', ' + st.done + ' of ' + st.total + ' tasks done'; }).join('\n') + '\n';
  if (late.length) s += '\nOverdue\n' + late.map(line).join('\n') + '\n';
  if (dated.length) s += '\nComing up\n' + dated.map(line).join('\n') + '\n';
  if (rest.length) s += '\n' + (late.length || dated.length ? 'Also open' : 'Open') + '\n' + rest.map(line).join('\n') + '\n';
  if (!open.length) s += '\nNothing open right now.\n';
  if (done.length) s += '\nDone in the last 2 weeks\n' + done.map(line).join('\n') + '\n';
  return s;
}

/* ============ Done log: what got finished, for reports ============ */
function logRange(){
  const td = today(), y = td.slice(0, 4), mo = td.slice(0, 7), r = UI.logRange || 'month';
  if (r === 'lastmonth'){ const first = mo + '-01', prevFirst = addMonthsClamp(first, -1); return { from: prevFirst, to: addDays(first, -1), label: parse(prevFirst).toLocaleDateString('en-US', { month:'long', year:'numeric' }) }; }
  if (r === '3m') return { from: addMonthsClamp(td, -3), to: td, label: 'The last 3 months' };
  if (r === 'year') return { from: y + '-01-01', to: td, label: y + ' so far' };
  if (r === 'all') return { from: '0000-01-01', to: td, label: 'Everything' };
  return { from: mo + '-01', to: td, label: parse(td).toLocaleDateString('en-US', { month:'long', year:'numeric' }) + ' so far' };
}
function doneReport(from, to, label){
  const inR = d => d && d >= from && d <= to;
  const done = tasks().filter(t => t.status === 'done' && inR(t.doneDate)).sort((a, b) => a.doneDate < b.doneDate ? -1 : 1);
  const steps = allSteps().filter(({t, c}) => c.done && inR(c.doneDate) && !done.includes(t));
  let md = '# Finished work: ' + label + '\n\n' + (from > '0000-01-01' ? short(from) + ', ' + from.slice(0, 4) + ' to ' : 'Up to ') + short(to) + ', ' + to.slice(0, 4) + '. ' + done.length + ' task' + (done.length === 1 ? '' : 's') + (steps.length ? ' and ' + steps.length + ' step' + (steps.length === 1 ? '' : 's') : '') + '.\n';
  if (!done.length && !steps.length) return md + '\nNothing marked done in this period.\n';
  const stepTasks = steps.map(x => x.t);
  for (const g of groupByCat([...new Set([...done, ...stepTasks])])){
    md += '\n## ' + g.cat.name + '\n';
    const byP = new Map();
    for (const t of g.items){ const k = projById(t.project)?.name || ''; if (!byP.has(k)) byP.set(k, []); byP.get(k).push(t); }
    for (const [pn, ts] of [...byP].sort((a, b) => !a[0] ? 1 : !b[0] ? -1 : a[0].localeCompare(b[0]))){
      md += '\n### ' + (pn || 'No project') + '\n';
      for (const t of ts){
        const who = whoOf(t) ? ' [' + whoOf(t) + ']' : '';
        if (done.includes(t)) md += '- ' + t.title + who + ' (' + short(t.doneDate) + ')' + '\n';
        for (const {c} of steps.filter(x => x.t === t)) md += '- ' + c.text + ', a step of “' + t.title + '”' + who + ' (' + short(c.doneDate) + ')\n';
      }
    }
  }
  return md;
}

/* ============ Week review ============ */
function reviewSec(W){
  const td = today();
  const doneT = tasks().filter(t => mine(t) && t.status === 'done' && t.doneDate && weekOf(t.doneDate) === W);
  const doneS = allSteps().filter(({t, c}) => mine(t) && c.done && c.doneDate && weekOf(c.doneDate) === W);
  const u = unfinishedThisWeek(), slipped = u.tasks.filter(t => !parked(t)), waiting = u.tasks.filter(parked);
  const late = sortTasks(tasks().filter(t => mine(t) && isOpen(t) && effDue(t) && effDue(t) < td && !slipped.includes(t)));
  const risk = allGoals().filter(({m}) => !m.done && m.due && dayDiff(td, m.due) <= 14).map(({p, m}) => ({ p, m, st: msStats(p, m) })).filter(x => x.st.done < x.st.total || x.m.due < td).sort((a, b) => a.m.due < b.m.due ? -1 : 1);
  const est = slipped.reduce((n, t) => n + (t.est || 0), 0);
  let h = `<div class="sec"><div class="sec-h"><h2>Week review</h2><span class="spacer"></span><button class="q" data-act="review">Close</button></div><div class="card review">
    <div class="rv-stats">
      <div class="rv-stat"><b>${doneT.length}</b>tasks done${doneS.length ? ', plus ' + doneS.length + ' step' + (doneS.length === 1 ? '' : 's') : ''}</div>
      <div class="rv-stat ${slipped.length ? 'bad' : ''}"><b>${slipped.length + u.steps.length}</b>still open from this week</div>
      <div class="rv-stat ${late.length ? 'bad' : ''}"><b>${late.length}</b>other overdue</div>
      <div class="rv-stat ${risk.length ? 'bad' : ''}"><b>${risk.length}</b>goals due within 2 weeks</div>
    </div>`;
  if (slipped.length || u.steps.length) h += `<h3>Didn’t get to${est ? ` <span style="text-transform:none">· ≈ ${fmtDur(est)} of work</span>` : ''}</h3><div class="rv-list">${sortTasks(slipped).map(t => taskRowOnly(t, 'due')).join('')}${u.steps.map(({t, c}) => stepRow(t, c, true, 'week')).join('')}</div>`;
  if (waiting.length) h += `<h3>Your part done, waiting on others</h3><div class="rv-list">${waiting.map(t => taskRowOnly(t, 'due')).join('')}</div>`;
  if (late.length) h += `<h3>Overdue, not on this week’s list</h3><div class="rv-list">${late.map(t => taskRowOnly(t, 'due')).join('')}</div>`;
  if (risk.length) h += `<h3>Goals coming due</h3>` + risk.map(({p, m, st}) => { const n = dayDiff(td, m.due), left = st.total - st.done; return `<div class="rv-row"><span data-act="nav" data-v="proj" data-id="${p.id}" style="cursor:pointer">⚑ <b>${esc(m.name)}</b></span>${projChip({ project: p.id })}${m.who ? `<span class="chip who">👤 ${esc(m.who)}</span>` : ''}<span class="chip mono ${n < 0 ? 'late' : n <= 7 ? 'soon' : ''}">due ${rel(m.due)} · ${dueIn(m.due)}</span><span class="chip mono">${st.done}/${st.total} done${left ? ', ' + left + ' open' : ''}</span></div>`; }).join('');
  const f = focusOf(W);
  if (f.length) h += `<h3>★ This week’s priorities</h3>` + f.map(k => { const { p, m } = focusParts(k), all = tasks().filter(t => t.project === p.id && (!m || t.milestone === m.id)); const dw = all.filter(t => t.status === 'done' && t.doneDate && weekOf(t.doneDate) === W).length, op = all.filter(isOpen).length; return `<div class="rv-row"><b>${m ? '⚑ ' : ''}${esc(focusLabel(k))}</b><span class="chip mono">${dw} done this week</span><span class="chip mono">${op} still open</span></div>`; }).join('');
  h += `<div class="rv-acts">${slipped.length || u.steps.length ? `<button class="btn ${UI.armed === 'wk-move' ? 'pri' : ''}" data-act="wk-move">${UI.armed === 'wk-move' ? 'Move ' + (u.tasks.length + u.steps.length) + ' to next week?' : 'Move unfinished to next week'}</button>` : ''}<button class="btn pri" data-act="review-next">Plan next week ›</button></div>
    <div class="hint" style="margin-top:10px">Unfinished tasks move to next week by themselves when it starts. Moving them now lets you see next week’s full list while you plan it. Week notes at the bottom of this page are a good place for how the week went.</div></div></div>`;
  return h;
}

        <label class="fld"><span class="lbl">Planned day</span><input type="date" id="d-day" value="${t.status==='done' ? (t.day||'') : t.status === 'waiting' ? (t.pingBy || '') : effDay(t)}" data-field="day" ${t.status === 'waiting' ? 'title="For a waiting task this is the day it comes back to check on (same as Ping again on)"' : ''}></label>
        ${t.day && t.status !== 'done' && t.status !== 'waiting' ? `<div class="fld" style="grid-column:1/-1"><span class="lbl">Block off</span><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${[1, 2, 3, 5].map(n => `<button class="q ${blockLen(t) === n ? 'on' : ''}" data-act="block" data-id="${t.id}" data-n="${n}">${n === 1 ? '1 day' : n + ' days'}</button>`).join('')}<span class="meta">or through</span><input type="date" id="d-dayto" value="${blockLen(t) > 1 ? t.dayTo : ''}" min="${effDay(t)}" data-field="dayTo" style="font-size:12px;padding:2px 6px"></div></div>` : ''}
        <label class="fld"><span class="lbl">On the week list</span><select id="d-week" data-field="week">
          <option value="">Not planned</option>
          <option value="${curWeek()}" ${effWeek(t)===curWeek()?'selected':''}>This week</option>
          <option value="${addDays(curWeek(),7)}" ${effWeek(t)===addDays(curWeek(),7)?'selected':''}>Next week</option>
          ${pingLater(t) && effWeek(t) > addDays(curWeek(),7) ? `<option value="${effWeek(t)}" selected>Week of ${short(effWeek(t))}</option>` : ''}
        </select></label>
        ${pingLater(t) ? `<div class="fld" style="grid-column:1/-1;font-size:12px;color:var(--muted)">⏳ Your part is done, so this is off your lists until the week of ${short(weekOf(t.pingBy))}. It comes back as a follow-up on ${short(t.pingBy)}. Change “Ping again on” to bring it back sooner.</div>` : ''}
        <label class="fld"><span class="lbl">Time needed</span><input id="d-est" list="est-presets" value="${t.est ? fmtDur(t.est) : ''}" placeholder="e.g. 30m, 2h" data-field="est" autocomplete="off"><datalist id="est-presets">${['15m','30m','45m','1h','1h 30m','2h','3h','4h','6h'].map(x => `<option value="${x}">`).join('')}</datalist></label>
        <label class="fld"><span class="lbl">Repeat</span><select id="d-repeat" data-field="repeat"><option value="">Doesn’t repeat</option>${REPEATS.map(([k, l]) => `<option value="${k}" ${t.repeat === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${t.repeat && REPEAT_SHORT[t.repeat] ? `<div class="fld" style="grid-column:1/-1;font-size:12px;color:var(--muted)">${t.status === 'done' ? (t.spawned && M.tasks.has(t.spawned) ? 'The next one has been added.' : '') : (() => { const nx = repNext(t); return 'When you finish this, the next one is added' + (nx.day ? ' for ' + short(nx.day) : '') + (nx.due ? (nx.day ? ', due ' : ', due ') + short(nx.due) : '') + '.'; })()}</div>` : ''}
      </div>
      <div><span class="lbl">Checklist</span>
        ${(t.checklist||[]).map((c,i) => `<div class="cl-item ${c.done?'done':''}">
          <input type="checkbox" ${c.done?'checked':''} data-act="cl-toggle" data-i="${i}" aria-label="Done">
          <input type="text" id="d-cl-${c.id}" value="${esc(c.text)}" data-cl="${i}">
          ${c.done ? '' : `<button class="q ${sDay(c)===today()?'on':''}" data-act="step-day" data-id="${t.id}" data-s="${c.id}">Today</button><button class="q ${sWeek(c)===curWeek()?'on':''}" data-act="step-week" data-id="${t.id}" data-s="${c.id}">Week</button>${stepDateBtn(t, c, 'dsd-')}`}
          <button class="x" data-act="cl-del" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}
        <input class="cl-add" id="d-cl-new" placeholder="Add a step" data-enter="cl-add">
