<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo List</title>
<meta name="theme-color" content="#141b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f6f7f9; --line:#dfe3e9; --line2:#eceff3;
  --text:#18202b; --muted:#667283; --faint:#98a2b0;
  --side:#141b26; --side-text:#97a8bf; --side-strong:#e5ecf5; --side-dim:#55667e;
  --side-hover:rgba(255,255,255,.06); --side-active:rgba(255,255,255,.11);
  --accent:#2f6fdc; --accent-soft:#e8f0fd;
  --doing:#2f6fdc; --wait:#b9740b; --wait-bg:#fff6e5; --wait-line:#f1d39b;
  --done:#1f9d55; --danger:#d14343; --danger-soft:#fdecec;
  --today:#f3f7ff; --shadow:0 12px 40px rgba(16,24,40,.18);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --panel:#161d27; --panel2:#1b2430; --line:#283444; --line2:#1f2935;
    --text:#e3e9f1; --muted:#97a4b6; --faint:#647386;
    --side:#0a0f15; --side-hover:rgba(255,255,255,.05); --side-active:rgba(255,255,255,.09);
    --accent:#5b93f0; --accent-soft:#1a2a45;
    --doing:#5b93f0; --wait:#e0a03a; --wait-bg:#2a2010; --wait-line:#5b4318;
    --done:#3fbf74; --danger:#ef6b6b; --danger-soft:#3a1d1f;
    --today:#152238; --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --panel2:#1b2430; --line:#283444; --line2:#1f2935;
  --text:#e3e9f1; --muted:#97a4b6; --faint:#647386;
  --side:#0a0f15; --side-hover:rgba(255,255,255,.05); --side-active:rgba(255,255,255,.09);
  --accent:#5b93f0; --accent-soft:#1a2a45;
  --doing:#5b93f0; --wait:#e0a03a; --wait-bg:#2a2010; --wait-line:#5b4318;
  --done:#3fbf74; --danger:#ef6b6b; --danger-soft:#3a1d1f;
  --today:#152238; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:flex;height:100%}

/* Sidebar */
aside{width:240px;flex-shrink:0;background:var(--side);color:var(--side-text);overflow-y:auto;padding:16px 10px 40px;display:flex;flex-direction:column;gap:2px}
.brand{color:var(--side-strong);font-weight:600;font-size:15px;padding:2px 8px 6px;display:flex;align-items:center;justify-content:space-between}
.brand small{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--side-dim)}
.nav{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;border:0;background:none;color:var(--side-text);text-align:left;width:100%;font-size:13px}
.nav:hover{background:var(--side-hover);color:var(--side-strong)}
.nav.on{background:var(--side-active);color:var(--side-strong)}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--side-dim)}
.nav .ct.hot{color:#f2b84b}
.nav .ic{width:16px;text-align:center;opacity:.8}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 6px;font-size:11.5px;color:var(--side-dim)}
.side-h button{border:0;background:none;color:var(--side-dim);font-size:16px;line-height:1;padding:0 4px;border-radius:4px}
.side-h button:hover{color:var(--side-strong);background:var(--side-hover)}
.cat-row{font-weight:500}
.cat-row .dot,.proj-row .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.chev{border:0;background:none;color:var(--side-dim);width:16px;padding:0;font-size:10px}
.proj-row{padding-left:30px;font-size:12.5px}
.proj-row .dot{width:5px;height:5px;border-radius:50%;opacity:.8}
.side-add{padding:5px 8px 5px 30px;font-size:12px;color:var(--side-dim);border:0;background:none;text-align:left;width:100%;border-radius:6px}
.side-add:hover{color:var(--side-strong);background:var(--side-hover)}
.side-input{display:flex;flex-direction:column;gap:6px;padding:4px 8px 8px 30px}
.side-input input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:5px 8px;color:var(--side-strong);outline:none;font-size:12.5px}
.side-input .row{display:flex;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#topbar button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 10px}
#scroll{flex:1;overflow-y:auto}
#view{max-width:1200px;margin:0 auto;padding:22px 28px 80px}
#note{display:none;margin:0 0 14px;padding:8px 12px;border-radius:6px;background:var(--wait-bg);border:1px solid var(--wait-line);font-size:12.5px}
#note.show{display:block}

.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.head h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.head .spacer{flex:1}
.title-input{font-size:21px;font-weight:600;border:1px solid transparent;background:none;border-radius:6px;padding:2px 6px;margin-left:-7px;min-width:120px;max-width:100%;letter-spacing:-.01em}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font-size:12.5px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger)}
.btn.warn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:30px;padding:0}

.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sec-h h2{font-size:14px;font-weight:600;margin:0}
.sec-h .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.sec-h .spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* Quick add */
.qadd{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.qadd input{flex:1 1 260px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--panel);outline:none}
.qadd input:focus{border-color:var(--accent)}
.qadd input.qa-date{flex:0 0 auto;padding:6px 8px}
.qadd select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);max-width:220px}

/* Follow-ups */
.fu{background:var(--wait-bg);border:1px solid var(--wait-line);border-radius:10px;padding:10px 14px;margin-top:16px}
.fu-h{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--wait)}
.fu-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--wait-line);flex-wrap:wrap}
.fu-row:first-of-type{border-top:0}
.fu-row .who{font-weight:600}
.fu-row .what{flex:1;min-width:160px;cursor:pointer}
.fu-row .when{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Groups and task rows */
.grp{padding:4px 0}
.grp + .grp{border-top:1px solid var(--line2)}
.grp-h{display:flex;align-items:center;gap:8px;padding:8px 14px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.grp-h .bar{width:3px;height:12px;border-radius:2px}
.grp-h .n{font-family:var(--mono);font-weight:400;color:var(--faint)}
.task{display:flex;align-items:flex-start;gap:10px;padding:7px 14px;position:relative}
.task:hover{background:var(--panel2)}
.task.dragging{opacity:.4}
.chk{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);background:none;margin-top:1px;padding:0;display:grid;place-items:center;color:#fff;font-size:10px;line-height:1}
.chk:hover{border-color:var(--done)}
.chk.doing{border-color:var(--doing);background:linear-gradient(90deg,var(--doing) 50%,transparent 50%)}
.chk.waiting{border-color:var(--wait);border-style:dashed}
.chk.done{border-color:var(--done);background:var(--done)}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-title{word-break:break-word}
.task.is-done .t-title{color:var(--faint);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chips:empty{display:none}
.chip{font-size:11px;border-radius:4px;padding:0 6px;line-height:18px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.mono{font-family:var(--mono);font-size:10.5px}
.chip.proj{display:inline-flex;align-items:center;gap:5px}
.chip.proj i{width:6px;height:6px;border-radius:2px;display:inline-block}
.chip.doing{color:var(--doing);border-color:color-mix(in srgb,var(--doing) 35%,transparent);background:color-mix(in srgb,var(--doing) 8%,transparent)}
.chip.wait{color:var(--wait);border-color:var(--wait-line);background:var(--wait-bg)}
.chip.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
.chip.soon{color:var(--wait)}
.chip.ahead{color:var(--doing)}
.set-row{display:flex;gap:14px 18px;flex-wrap:wrap;margin-top:10px}
.set-row label.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.chip.roll{color:var(--wait);border-style:dashed}
.chip.carry{border-style:dashed}
.t-quick{display:flex;gap:4px;opacity:0;flex-shrink:0}
.task:hover .t-quick,.task:focus-within .t-quick{opacity:1}
.q{border:1px solid var(--line);background:var(--panel);border-radius:5px;font-size:11px;padding:1px 7px;color:var(--muted)}
.q:hover{color:var(--text);border-color:var(--faint)}
.q.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}
.drop-hint{outline:2px dashed var(--accent);outline-offset:-2px}

/* Days */
.days-wrap{overflow-x:auto;padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1000px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);background:var(--today)}
.day.past{opacity:.85}
.day-h{display:flex;align-items:baseline;gap:6px;padding:8px 10px 6px;border-bottom:1px solid var(--line2)}
.day-h b{font-size:13px}
.day-h span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day-h em{font-style:normal;margin-left:auto;font-size:11px;color:var(--accent);font-weight:600}
.day-list{padding:4px 0;flex:1}
.ditem{display:flex;gap:7px;align-items:flex-start;padding:4px 10px;font-size:12.5px}
.ditem:hover{background:var(--panel2)}
.ditem .chk{width:14px;height:14px;font-size:8px;margin-top:2px;border-width:2px}
.ditem .dt{flex:1;min-width:0;cursor:pointer;word-break:break-word}
.ditem.is-done .dt{color:var(--faint);text-decoration:line-through}
.ditem .cd{width:6px;height:6px;border-radius:2px;margin-top:6px;flex-shrink:0}
.ditem .r{font-family:var(--mono);font-size:10px;color:var(--wait)}
.day-empty{padding:6px 10px;color:var(--faint);font-size:11.5px}

/* Accomplished + notes */
.acc{padding:6px 16px 12px}
.acc-cat{margin-top:8px}
.acc-cat h3{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:0 0 3px}
.acc-cat h3 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.acc-cat ul{margin:0;padding-left:22px}
.acc-cat li{font-size:13px;padding:1px 0}
.acc-cat li span{color:var(--muted)}
textarea.notes{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;outline:none;line-height:1.55}
textarea.notes:focus{border-color:var(--accent)}

/* Log */
.wk{margin-bottom:12px}
.wk-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer;flex-wrap:wrap}
.wk-h b{font-size:14px}
.wk-h .spacer{flex:1}
.wk-note{padding:8px 16px 0;color:var(--muted);font-size:12.5px;white-space:pre-wrap}

/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(10,15,22,.35);display:none;z-index:40}
#scrim.show{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s ease;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.dr-h .crumb{margin:0;flex:1}
.dr-b{flex:1;overflow-y:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:16px}
.dr-title{width:100%;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);resize:none;min-height:42px;outline:none}
.dr-title:focus{border-color:var(--accent)}
.lbl{font-size:11.5px;color:var(--muted);margin-bottom:5px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:6px 4px;font-size:12.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.w{background:var(--wait)}
.seg button.on.d{background:var(--done)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.wbox{background:var(--wait-bg);border:1px solid var(--wait-line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wbox .meta{font-size:11.5px;color:var(--muted)}
.cl-item{display:flex;align-items:center;gap:8px;padding:3px 0}
.cl-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--done)}
.cl-item input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;outline:none}
.cl-item input[type=text]:focus{border-bottom-color:var(--accent)}
.cl-item.done input[type=text]{color:var(--faint);text-decoration:line-through}
.cl-item .x{border:0;background:none;color:var(--faint);font-size:14px;padding:0 4px}
.cl-item .x:hover{color:var(--danger)}
.cl-add{width:100%;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;background:none;outline:none;margin-top:4px}
.cl-add:focus{border-style:solid;border-color:var(--accent)}
.ms-qadd{display:block;width:calc(100% - 28px);margin:6px 14px 12px;border:1px dashed var(--line);border-radius:6px;padding:7px 10px;background:none;outline:none;color:var(--text);font-size:13px}
.ms-qadd:focus{border-style:solid;border-color:var(--accent);background:var(--panel)}
.dr-notes{width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);resize:vertical;outline:none}
.dr-notes:focus{border-color:var(--accent)}
.check-line{display:flex;align-items:center;gap:8px;font-size:13px}

/* Quick capture */
.prev{font-size:12px;color:var(--muted);padding:6px 4px 0;display:flex;flex-direction:column;gap:2px}
.prev:empty{display:none}
.prev b{color:var(--text);font-weight:500}
.prev .to{color:var(--accent)}
.cap{max-width:560px;margin:8px auto 0}
.cap h1{font-size:21px;margin:0 0 4px}
.cap textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);outline:none;resize:vertical;font-size:16px;line-height:1.5}
.cap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cap .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cap .btn.pri{padding:9px 20px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.hint code{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
#fab{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;line-height:1;box-shadow:var(--shadow);z-index:30}

/* Milestones */
.ms{margin-top:14px;overflow:hidden}
.ms.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ms-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ms-num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);flex-shrink:0}
.ms.current .ms-num{background:var(--accent);border-color:var(--accent);color:#fff}
.ms.reached .ms-num{background:var(--done);border-color:var(--done);color:#fff}
.ms-name{flex:1 1 200px;min-width:0;font-size:15px;font-weight:600;border:1px solid transparent;background:none;border-radius:5px;padding:2px 5px;margin-left:-5px}
.ms-name:hover{border-color:var(--line)}
.ms-name:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.ms.reached .ms-name{color:var(--muted)}
.ms-tag{font-size:11px;font-weight:600;color:var(--accent)}
.ms-prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ms-bar{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.ms-bar i{display:block;height:100%;background:var(--done)}
.ms-tools{display:flex;gap:4px}
.ms-tools .q{padding:2px 7px}
.ms-foot{padding:6px 14px 10px;font-size:12px;color:var(--muted)}
.ms-foot button{border:0;background:none;color:var(--accent);padding:0;font-size:12px}
.ms-add{display:flex;gap:8px;margin-top:14px}
.ms-add input{flex:1;border:1px dashed var(--line);border-radius:8px;padding:9px 12px;background:none;outline:none}
.ms-add input:focus{border-style:solid;border-color:var(--accent);background:var(--panel)}
.chip.ms-chip{max-width:220px;overflow:hidden;text-overflow:ellipsis}

<body>
<div id="app">
  <aside id="side"></aside>
  <main>
    <div id="topbar"><button onclick="toggleSide()" aria-label="Menu">☰</button><b id="top-title">Todo List</b></div>

  </main>
</div>
<button id="fab" data-act="nav" data-v="add" aria-label="Quick add">+</button>
<div id="scrim" onclick="closeOverlays()"></div>
<div id="drawer" aria-hidden="true"></div>

<script>
/* ============ Dates ============ */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const weekOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const curWeek = () => weekOf(today());
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const dayDiff = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function rel(s){
  const n = dayDiff(today(), s);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 1 && n < 7) return DOW[(parse(s).getDay()+6)%7];
  return short(s);
}
function weekLabel(w){
  const e = addDays(w,6), a = parse(w), b = parse(e);
  const left = `${MON[a.getMonth()]} ${a.getDate()}`;
  const right = a.getMonth()===b.getMonth() ? `${b.getDate()}` : `${MON[b.getMonth()]} ${b.getDate()}`;
  return `${left}–${right}, ${b.getFullYear()}`;
}

/* ============ Model ============ */
const PALETTE = ['#0e9f8e','#2f6fdc','#c27c0e','#8a5cf5','#d14d72','#4b8a2f','#6b7a90'];
const M = { meta:null, tasks:new Map(), weeks:new Map() };
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone = o => JSON.parse(JSON.stringify(o));

const cats = () => M.meta?.categories || [];
const projs = () => M.meta?.projects || [];
const catById = id => cats().find(c => c.id === id);
const projById = id => projs().find(p => p.id === id);
const taskCat = t => catById(t.cat) || catById(projById(t.project)?.cat);
const tasks = () => [...M.tasks.values()];
const msList = p => (p && p.milestones) || [];
const msById = (t) => msList(projById(t.project)).find(m => m.id === t.milestone);
function currentMs(p){ return msList(p).find(m => !m.done); }
function msStats(p, m){ const l = tasks().filter(t => t.project === p.id && t.milestone === m.id); return { total:l.length, done:l.filter(t => t.status === 'done').length, list:l }; }

function effDay(t){
  if (t.status === 'done') return t.doneDate || '';
  if (!t.day) return '';
  const td = today();
  return t.day < td ? td : t.day;
}
const rolled = t => t.status !== 'done' && t.day && t.day < today();
function effWeek(t){
  if (t.status === 'done') return t.doneDate ? weekOf(t.doneDate) : '';
  const d = effDay(t); if (d) return weekOf(d);
  if (!t.week) return '';
  const cw = curWeek(); return t.week < cw ? cw : t.week;
}
const stepsOf = t => t.checklist || [];
function sDay(c){ if (c.done) return c.doneDate || ''; if (!c.day) return ''; const td = today(); return c.day < td ? td : c.day; }
function sWeek(c){ if (c.done) return c.doneDate ? weekOf(c.doneDate) : ''; const d = sDay(c); if (d) return weekOf(d); if (!c.week) return ''; const cw = curWeek(); return c.week < cw ? cw : c.week; }
const sRolled = c => !c.done && c.day && c.day < today();
function allSteps(){ const out = []; for (const t of M.tasks.values()) for (const c of stepsOf(t)) if (isOpen(t) || c.done) out.push({ t, c }); return out; }
function findStep(tid, sid){ const t = M.tasks.get(tid); const c = t && stepsOf(t).find(x => x.id === sid); return c ? { t, c } : null; }
const pingDue = t => t.status === 'waiting' && t.pingBy && t.pingBy <= today();
const isOpen = t => t.status !== 'done';

/* Deadlines: when a deadline starts showing up, and calendar alerts */
const LEAD_OPTS = [[7,'1 week'],[14,'2 weeks'],[30,'1 month'],[60,'2 months'],[90,'3 months'],[180,'6 months']];
const leadLabel = n => (LEAD_OPTS.find(o => o[0] === n) || [n, n + ' days'])[1];
const defLead = () => +(M.meta?.leadDays) || 30;
const leadOf = t => +(t.lead) || defLead();
const showFrom = t => t.due ? addDays(t.due, -leadOf(t)) : '';
const surfaced = (t, D) => isOpen(t) && !!t.due && (D || today()) >= showFrom(t);
const calAlerts = () => ({ start:true, week:true, day:true, on:false, ...(M.meta?.calAlerts || {}) });
function dueIn(d){
  const n = dayDiff(today(), d);
  if (n < 0) return 'overdue ' + (-n) + (n === -1 ? ' day' : ' days');
  if (n === 0) return 'today'; if (n === 1) return 'tomorrow';
  if (n < 14) return 'in ' + n + ' days';
  if (n < 60) return 'in ' + Math.round(n/7) + ' wk';
  return 'in ' + Math.round(n/30.4) + ' mo';
}

/* ============ Storage: local first, synced to a private GitHub repo ============ */
const LS_KEY = 'lt_state_v1', LS_GH = 'lt_github', LS_DIRTY = 'lt_dirty', LS_LAST = 'lt_lastsync';
let ready = false;
M.deleted = {};
let ver = 0;                       // bumps on every local change
const SYNC = { state:'idle', msg:'', last:+(localStorage.getItem(LS_LAST) || 0), running:false, again:false, timer:null };

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function ghCfg(){ try { return JSON.parse(lsGet(LS_GH) || 'null'); } catch(e){ return null; } }

function snapshot(){
  return { meta: M.meta ? clone(M.meta) : null, tasks: tasks().map(clone), notes: [...M.weeks.values()].map(clone), deleted: { ...M.deleted } };
}
function loadState(st){
  M.meta = st.meta || null;
  M.tasks = new Map((st.tasks || []).map(t => [t.id, t]));
  M.weeks = new Map((st.notes || st.weeks || []).map(w => [w.id, w]));
  M.deleted = st.deleted || {};
}
function persist(){
  ver++;
  lsSet(LS_KEY, JSON.stringify(snapshot()));
  lsSet(LS_DIRTY, '1');
  scheduleSync(4000);
}
function loadLocal(){
  try { const d = JSON.parse(lsGet(LS_KEY) || 'null'); if (d) loadState(d); } catch(e){}
}
const stamp = o => { o._u = Date.now(); return o; };
const saveTask = t => { stamp(t); M.tasks.set(t.id, t); persist(); };
const saveMeta = () => { if (M.meta) stamp(M.meta); persist(); };
const saveWeek = w => { stamp(w); M.weeks.set(w.id, w); persist(); };
function removeTask(id){ M.tasks.delete(id); M.deleted[id] = Date.now(); persist(); }

/* merge two states record by record; newest edit wins, deletions win over older edits */
function mergeStates(a, b){
  const pick = (x, y) => !x ? y : !y ? x : ((y._u || 0) > (x._u || 0) ? y : x);
  const deleted = { ...(a.deleted || {}) };
  for (const [id, ts] of Object.entries(b.deleted || {})) deleted[id] = Math.max(deleted[id] || 0, ts);
  const mergeList = (la, lb) => {
    const ma = new Map((la || []).map(r => [r.id, r])), mb = new Map((lb || []).map(r => [r.id, r]));
    const out = [];
    for (const id of new Set([...ma.keys(), ...mb.keys()])){
      const r = pick(ma.get(id), mb.get(id));
      if (deleted[id] && deleted[id] >= (r._u || 0)) continue;
      out.push(r);
    }
    return out.sort((x, y) => x.id < y.id ? -1 : 1);
  };
  return { meta: pick(a.meta, b.meta), tasks: mergeList(a.tasks, b.tasks), notes: mergeList(a.notes, b.notes), deleted };
}
const canon = st => JSON.stringify({ meta: st.meta, tasks: [...(st.tasks||[])].sort((x,y) => x.id < y.id ? -1 : 1), notes: [...(st.notes||[])].sort((x,y) => x.id < y.id ? -1 : 1), deleted: st.deleted || {} });

/* GitHub contents API */
function b64encode(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64decode(b64){ const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function ghHeaders(cfg, accept){ return { 'Authorization': 'Bearer ' + cfg.token, 'Accept': accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; }
function ghUrl(cfg){ return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`; }
class GhError extends Error { constructor(msg, kind){ super(msg); this.kind = kind; } }
async function ghCheckRepo(cfg){
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, { headers: ghHeaders(cfg), cache:'no-store' });
  if (r.status === 401) throw new GhError('GitHub didn’t accept the token (401). Check that you copied all of it, with no spaces at the start or end, and that it hasn’t expired.', 'auth');
  if (r.status === 404 || r.status === 403) throw new GhError('GitHub says it can’t find ' + cfg.owner + '/' + cfg.repo + ' for this token (' + r.status + '). Check the spelling, and that when you made the token you chose “Only select repositories” and picked ' + cfg.repo + '.', 'auth');
  if (!r.ok) throw new GhError('GitHub returned an error (' + r.status + ').', 'net');
  const j = await r.json();
  if (!j.private) throw new GhError('That repository is public, so anyone could read your tasks. Make it private on GitHub (Settings › Danger zone › Change visibility), then connect again.', 'public');
  return j;
}
async function ghGet(cfg){
  const r = await fetch(ghUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch), { headers: ghHeaders(cfg), cache:'no-store' });
  if (r.status === 404) return { state:null, sha:null };
  if (r.status === 401) throw new GhError('GitHub rejected the token. It may have expired; make a new one and reconnect.', 'auth');
  if (r.status === 403) throw new GhError('GitHub refused access (403). The token may lack “Contents: read and write” on this repo, or you hit a rate limit.', 'auth');
  if (!r.ok) throw new GhError('Couldn’t read from GitHub (' + r.status + ').', 'net');
  const j = await r.json();
  let text;
  if (j.content && j.encoding === 'base64') text = b64decode(j.content);
  else {
    const rr = await fetch(ghUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch), { headers: ghHeaders(cfg, 'application/vnd.github.raw'), cache:'no-store' });

function scheduleSync(ms){
  clearTimeout(SYNC.timer);
  if (!ghCfg()) return;
  SYNC.timer = setTimeout(() => sync(), ms);
}
function setSync(state, msg){ SYNC.state = state; SYNC.msg = msg || ''; const el = document.getElementById('sync-pill'); if (el) el.outerHTML = syncPill(); if (UI.view === 'sync') requestRender(); }
async function sync(){
  const cfg = ghCfg(); if (!cfg) return;
  if (SYNC.running){ SYNC.again = true; return; }
  if (!navigator.onLine){ setSync('offline'); return; }
  SYNC.running = true; setSync('syncing');
  try {
    for (let attempt = 0; attempt < 4; attempt++){
      const startVer = ver;
      const remote = await ghGet(cfg);
      const local = snapshot();
      const merged = remote.state ? mergeStates(local, remote.state) : local;
      const needPush = !remote.state || canon(merged) !== canon(remote.state);
      // fold in anything changed on screen while we were waiting
      const current = ver === startVer ? merged : mergeStates(snapshot(), merged);
      if (canon(current) !== canon(local)){ loadState(current); lsSet(LS_KEY, JSON.stringify(current)); requestRender(); }
      if (needPush){
        const res = await ghPut(cfg, merged, remote.sha);
        if (res === 'conflict') continue;
      }
      if (ver === startVer) lsSet(LS_DIRTY, '');
      else SYNC.again = true;
      SYNC.last = Date.now(); lsSet(LS_LAST, String(SYNC.last));
      setSync('ok');
      return;
    }
    setSync('error', 'Kept colliding with another device’s save. Will try again shortly.');
    SYNC.again = true;
  } catch(e){
    if (e instanceof TypeError) setSync('offline');
    else setSync('error', e.message || 'Sync failed.');
  } finally {
    SYNC.running = false;
    if (SYNC.again){ SYNC.again = false; scheduleSync(SYNC.state === 'error' ? 30000 : 800); }
  }
}
function syncPill(){
  const cfg = ghCfg();
  let dot = 'var(--side-dim)', text = 'This device only';
  if (cfg){
    if (SYNC.state === 'syncing'){ dot = '#5b93f0'; text = 'Syncing…'; }
    else if (SYNC.state === 'offline'){ dot = '#e0a03a'; text = 'Offline, saved here'; }
    else if (SYNC.state === 'error'){ dot = '#ef6b6b'; text = 'Sync problem'; }
    else if (SYNC.last){ dot = '#3fbf74'; const m = Math.round((Date.now() - SYNC.last) / 60000); text = 'Synced ' + (m < 1 ? 'just now' : m < 60 ? m + ' min ago' : new Date(SYNC.last).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })); }
    else text = 'Not synced yet';
  }
  return `<button id="sync-pill" class="sync-pill" data-act="nav" data-v="sync"><i style="background:${dot}"></i>${text}</button>`;
}

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function aliases(){
  const list = [], firstWords = {};
  const live = projs().filter(p => !p.archived);
  live.forEach(p => { const fw = p.name.trim().split(/\s+/)[0].toLowerCase(); firstWords[fw] = (firstWords[fw]||0) + 1; });
  for (const p of live){
    const full = p.name.trim().toLowerCase();
    list.push([full, 'p:' + p.id]);
    const fw = full.split(/\s+/)[0];
    if (fw !== full && fw.length >= 3 && firstWords[fw] === 1) list.push([fw, 'p:' + p.id]);
  }
  list.sort((a,b) => b[0].length - a[0].length);
  const catList = cats().map(c => [c.name.trim().toLowerCase(), 'c:' + c.id]).sort((a,b) => b[0].length - a[0].length);
  return [...list, ...catList];
}
function findTarget(text){

}
function fmtClock(h, m, ap){ return h + (m ? ':' + pad(m) : '') + (ap ? ' ' + ap : ''); }

const DATE_WORDS = '(today|tonight|tomorrow|tmrw?|tmr|next week|this week|monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)';

function parseQuick(raw){

  const out = { title:'', target:'', when:'', due:'', waitingOn:'' };

}
function targetName(t){
  if (!t) return 'Inbox';
  if (t.startsWith('p:')){ const p = projById(t.slice(2)); if (!p) return 'Inbox'; const c = catById(p.cat); return (c ? c.name + ' › ' : '') + p.name; }

}

  }

function nestedSteps(t, ctx){
  if (!isOpen(t) || !stepsOf(t).length) return '';
  const D = UI.view === 'today' ? UI.day : today();
  const openS = stepsOf(t).filter(c => !c.done);
  const shownDone = ctx === 'today' ? stepsOf(t).filter(c => c.done && c.doneDate === D) : [];
  const hiddenDone = stepsOf(t).filter(c => c.done).length - shownDone.length;
  if (!openS.length && !shownDone.length && !hiddenDone) return '';
  return `<div class="steps">${openS.map(c => stepRow(t, c, false, ctx)).join('')}${shownDone.map(c => stepRow(t, c, false, ctx)).join('')}${hiddenDone ? `<div class="steps-more">✓ ${hiddenDone} step${hiddenDone===1?'':'s'} done</div>` : ''}</div>`;
}
function taskRow(t, ctx){
  return taskRowOnly(t, ctx) + (['proj','today','week','cat','inbox','waiting'].includes(ctx) ? nestedSteps(t, ctx) : '');
}
function taskRowOnly(t, ctx){
  const w = UI.view === 'week' ? UI.week : curWeek();
  const inToday = effDay(t) === today() && t.status !== 'done';
  const inWeek = effWeek(t) === w && t.status !== 'done';

    ${t.status!=='done' && ctx === 'today' ? `<div class="t-quick">${timeBtn(t, null, ctx)}<button class="q" data-act="unplan" data-id="${t.id}" title="Take it off this day">Not ${UI.day===today()?'today':'this day'}</button></div>` : ''}
    ${t.status!=='done' && ctx !== 'today' ? `<div class="t-quick">
      <button class="q ${inToday?'on':''}" data-act="today" data-id="${t.id}" title="Plan for today">Today</button>
      <button class="q ${inWeek?'on':''}" data-act="week" data-id="${t.id}" title="Put on the week list">Week</button>
      ${ctx === 'proj' ? `<button class="q" data-act="add-step" data-id="${t.id}" title="Break into steps">+ Step</button>` : ''}
    </div>` : ''}

}
function targetOptions(selected){
  let html = `<option value="" ${selected===''?'selected':''}>Inbox (sort later)</option>`;
  for (const c of cats()){
    html += `<optgroup label="${esc(c.name)}">`;
    for (const p of projs().filter(p => p.cat === c.id && !p.archived))
      html += `<option value="p:${p.id}" ${selected==='p:'+p.id?'selected':''}>${esc(p.name)}</option>`;
    html += `<option value="c:${c.id}" ${selected==='c:'+c.id?'selected':''}>${esc(c.name)}, no project</option></optgroup>`;
  }

function defaultTarget(){
  if (UI.view === 'proj' && UI.proj) return 'p:' + UI.proj;
  if (UI.view === 'cat' && UI.cat) return 'c:' + UI.cat;
  const v = UI.lastProj;
  if (v.startsWith('p:') && projById(v.slice(2))) return v;
  if (v.startsWith('c:') && catById(v.slice(2))) return v;
  const p = projs()[0]; if (p) return 'p:' + p.id;
  const c = cats()[0]; return c ? 'c:' + c.id : '';
}
function groupByCat(list){
  const out = [];
  for (const c of cats()){
    const items = list.filter(t => taskCat(t)?.id === c.id);
    if (items.length) out.push({ cat:c, items });
  }
  const rest = list.filter(t => !taskCat(t));
  if (rest.length) out.push({ cat:{ id:'', name:'Inbox', color:'var(--faint)' }, items:rest });
  return out;
}
const statusRank = { doing:0, waiting:1, todo:2, done:3 };
const sortTasks = list => list.sort((a,b) =>
  (statusRank[a.status]-statusRank[b.status]) ||
  ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) ||
  (a.created < b.created ? -1 : 1));

function renderWeek(){
  const W = UI.week, cw = curWeek(), td = today();
  const isCur = W === cw, isPast = W < cw;
  const all = tasks();

  // Week list: open tasks whose effective week is W, plus done tasks that were planned for W
  const planned = all.filter(t => isOpen(t) ? effWeek(t) === W : (t.weeks||[]).includes(W) && t.doneDate && weekOf(t.doneDate) === W);
  const carried = isPast ? all.filter(t => (t.weeks||[]).includes(W) && !(t.doneDate && weekOf(t.doneDate) === W)) : [];
  const doneW = all.filter(t => t.status === 'done' && t.doneDate && weekOf(t.doneDate) === W);
  const stepsW = isPast ? [] : allSteps().filter(({t,c}) => !c.done && sWeek(c) === W && !(isOpen(t) && effWeek(t) === W));
  const stepsDoneW = allSteps().filter(({c}) => c.done && c.doneDate && weekOf(c.doneDate) === W);
  const openN = planned.filter(isOpen).length + stepsW.length;

  let whenOpts = '';
  if (!isPast){
    if (isCur) whenOpts += `<option value="today" ${UI.lastWhen==='today'?'selected':''}>Today</option>`;
    whenOpts += `<option value="week" ${UI.lastWhen==='week'?'selected':''}>${isCur?'This week':'That week'}, no day</option>`;
    for (let i=0;i<7;i++){ const d = addDays(W,i); if (d > td || !isCur) whenOpts += `<option value="${d}">${DOW[i]} ${short(d)}</option>`; }
  }

  let h = `<div class="weekv"><div class="o-head"><div class="head">
      <button class="icon-btn" data-act="wk-prev" aria-label="Previous week">‹</button>
      <h1>${isCur ? 'This week' : isPast ? 'Week of ' + short(W) : 'Week of ' + short(W)}</h1>
      <button class="icon-btn" data-act="wk-next" aria-label="Next week">›</button>
      ${!isCur ? `<button class="btn" data-act="wk-now">Back to this week</button>` : ''}
      <span class="spacer"></span>
      <button class="btn" data-act="export">Export week (.md)</button>
    </div>
    <div class="sub">${weekLabel(W)}. ${doneW.length} done${isPast ? '' : `, ${openN} open`}${carried.length ? `, ${carried.length} carried forward` : ''}.</div></div>`;

  // Follow-ups due
  if (isCur){
    const fu = all.filter(pingDue).sort((a,b) => a.pingBy < b.pingBy ? -1 : 1);
    if (fu.length){
      h += `<div class="o-fu"><div class="fu"><div class="fu-h">Follow up today</div>` + fu.map(t => `<div class="fu-row">
        <span class="who">${esc(t.waitingOn || 'Someone')}</span>
        <span class="what" data-act="open" data-id="${t.id}">${esc(t.title)}</span>

        <button class="btn" data-act="pinged" data-id="${t.id}">Pinged, remind in 3 days</button>

  // Week list

    <div class="card" data-drop="week">`;
  const listItems = isPast ? [...new Set([...planned, ...carried])] : planned;
  if (!listItems.length && !stepsW.length) h += `<div class="empty">${isPast ? 'Nothing was planned for this week.' : 'Nothing planned yet. Add tasks above, or press “Week” on a task or step in a project.'}</div>`;

  const grpCats = groupByCat([...new Set([...sortTasks(listItems), ...stepTasks])]);
  for (const g of grpCats){
    const gTasks = g.items.filter(t => listItems.includes(t));
    const gSteps = stepsW.filter(x => g.items.includes(x.t));
    h += `<div class="grp"><div class="grp-h"><span class="bar" style="background:${g.cat.color}"></span>${esc(g.cat.name)}<span class="n">${gTasks.length + gSteps.length}</span></div>`;
    h += gTasks.map(t => {
      let row = taskRow(t, 'week');
      if (isPast && carried.includes(t)) row = row.replace('<div class="chips">', `<div class="chips"><span class="chip carry">${t.status==='done' ? 'done ' + short(t.doneDate) : 'carried forward'}</span>`);
      return row;
    }).join('');
    h += gSteps.map(({t,c}) => stepRow(t, c, true, 'week')).join('') + `</div>`;
  }
  h += `</div></div>`;

  // Days
  h += `<div class="sec o-days"><div class="sec-h"><h2>${isPast ? 'Done by day' : 'Day by day'}</h2><span class="spacer"></span><span class="n">${isPast ? '' : 'Unfinished items move to today automatically'}</span></div><div class="days-wrap"><div class="days">`;
  for (let i=0;i<7;i++){

      <span class="dt" data-act="open" data-id="${t.id}">${c.time && !c.done ? `<span class="tm">${esc(c.time)}</span>` : ''}${esc(c.text)}${sRolled(c)?' <span class="r">↻</span>':''}<span class="dsub">↳ ${esc(t.title)}</span></span>
      <span class="cd" style="background:${catColor(t)}"></span></div>`).join('');
    h += items.map(t => `<div class="ditem ${t.status==='done'?'is-done':''}" draggable="true" data-drag="${t.id}">
      <button class="chk ${t.status}" data-act="done" data-id="${t.id}" aria-label="Toggle done">${t.status==='done'?'✓':''}</button>
      <span class="dt" data-act="open" data-id="${t.id}">${t.time && isOpen(t) ? `<span class="tm">${esc(t.time)}</span>` : ''}${esc(t.title)}${t.status==='waiting'?' <span class="r">⏳</span>':''}${rolled(t)?` <span class="r" title="Moved from ${short(t.day)}">↻</span>`:''}</span>
      <span class="cd" style="background:${catColor(t)}"></span>
    </div>`).join('');
    h += `</div></div>`;
  }
  h += `</div></div></div>`;

  // Accomplished
  h += `<div class="sec o-acc"><div class="sec-h"><h2>Accomplished</h2><span class="n">${doneW.length}${stepsDoneW.length ? ' tasks, ' + stepsDoneW.length + ' steps' : ''}</span></div><div class="card">`;
  h += doneW.length || stepsDoneW.length ? `<div class="acc">${accList(doneW, stepsDoneW)}</div>` : `<div class="empty">Finished tasks and steps will collect here as the week’s record.</div>`;
  h += `</div></div>`;

  // Notes

  h += `<div class="sec o-notes"><div class="sec-h"><h2>Week notes</h2><span class="n">meetings, small wins, anything that wasn’t a task</span></div>
    <textarea class="notes" id="wk-notes" data-wk="${W}" placeholder="Write notes for this week…">${esc(wk?.note || '')}</textarea></div></div>`;
  return h;
}
function accList(list, steps){

  return groupByCat([...new Set([...list, ...stepTasks])]).map(g => {
    const gt = g.items.filter(t => list.includes(t));
    const gs = steps.filter(x => g.items.includes(x.t) && !list.includes(x.t));

    return `<div class="acc-cat"><h3><i style="background:${g.cat.color}"></i>${esc(g.cat.name)} <span class="n" style="font-family:var(--mono);font-weight:400;color:var(--faint)">${gt.length + gs.length}</span></h3><ul>` +
      gt.map(t => `<li>${esc(t.title)}${projById(t.project) ? ` <span>(${esc(projById(t.project).name)})</span>` : ''}${gsIn.filter(x => x.t === t).length ? `<span>, incl. ${gsIn.filter(x => x.t === t).map(x => esc(x.c.text)).join(', ')}</span>` : ''}</li>`).join('') +
      gs.map(({t,c}) => `<li>${esc(c.text)} <span>(step of ${esc(t.title)})</span></li>`).join('') + `</ul></div>`;
  }).join('');
}

function renderToday(){

  const pct = totalN ? Math.round(100 * doneN / totalN) : 0;

    </div>
    <div class="sub">${longDate}</div>
    ${totalN ? `<div class="prog"><span class="bar"><i style="width:${pct}%"></i></span>${doneN} of ${totalN} done</div>` : ''}`;

  if (isToday){
    const fu = all.filter(pingDue);
    if (fu.length) h += `<div class="fu" style="margin-top:0;margin-bottom:16px"><div class="fu-h">Follow up today</div>` + fu.map(t => `<div class="fu-row">
        <span class="who">${esc(t.waitingOn || 'Someone')}</span>
        <span class="what" data-act="open" data-id="${t.id}">${esc(t.title)}</span>
        <button class="btn" data-act="pinged" data-id="${t.id}">Pinged, remind in 3 days</button>
        <button class="btn" data-act="done" data-id="${t.id}">Resolved</button></div>`).join('') + `</div>`;
  }

  // left: the day's list
  let left = '';
  if (!isPast) left += quickAdd(`<option value="${D}">${isToday ? 'Today' : dname}</option><option value="week">This week</option><option value="none">No date</option>`);
  left += `<div class="sec" style="margin-top:${isPast?0:16}px"><div class="sec-h"><h2>${isPast ? 'Done that day' : 'Plan'}</h2><span class="n">${isPast ? doneN : (openP.length + flatOpen.length) + ' to do'}</span></div><div class="card" data-drop="${D}">`;
  if (isPast) left += doneN ? doneP.map(t => taskRow(t,'today')).join('') + daySteps.filter(x => x.c.done).map(({t,c}) => stepRow(t, c, true, 'today')).join('') : `<div class="empty">Nothing was marked done.</div>`;
  else {
    const catIdx = t => { const c = taskCat(t); const i = cats().indexOf(c); return i < 0 ? 99 : i; };
    const entries = [...openP.map(t => ({ t, c:null })), ...flatOpen].sort((a,b) => (timeStart(a.c ? a.c.time : a.t.time) - timeStart(b.c ? b.c.time : b.t.time)) || (catIdx(a.t) - catIdx(b.t)) || ((a.t.project||'') < (b.t.project||'') ? -1 : (a.t.project||'') > (b.t.project||'') ? 1 : 0) || (a.c ? 1 : 0) - (b.c ? 1 : 0));
    left += entries.length ? entries.map(e => e.c ? stepRow(e.t, e.c, true, 'today') : taskRow(e.t, 'today')).join('') : `<div class="empty">${isToday ? 'Nothing planned for today yet. Pick tasks or steps from your projects on the right.' : 'Nothing planned yet. Pick tasks or steps on the right.'}</div>`;
    if (doneP.length || flatDone.length) left += `<div class="grp"><div class="grp-h">Done<span class="n">${doneP.length + flatDone.length}</span></div>${doneP.map(t => taskRow(t,'today')).join('')}${flatDone.map(({t,c}) => stepRow(t, c, true, 'today')).join('')}</div>`;
  }
  left += `</div></div>`;
  if (!isPast) left += deadlinesSec(all.filter(t => surfaced(t, D) && effDay(t) !== D));
  const dn = M.weeks.get('d-' + D);
  left += `<div class="sec"><div class="sec-h"><h2>Notes for the day</h2><span class="n">time blocks, reminders, how it went</span></div>
    <textarea class="notes" id="day-notes" data-day="${D}" placeholder="2–4 in the lab&#10;after 5: answer emails&#10;remember to bring the adapters">${esc(dn?.note || '')}</textarea></div>`;

  if (isPast) return h + left;
  return h + `<div class="today-grid"><div>${left}</div><div class="picker">${renderPicker(D)}</div></div>`;
}

function deadlinesSec(list, cls){
  if (!list.length) return '';
  list.sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
  return `<div class="sec ${cls||''}"><div class="sec-h"><h2>Deadlines coming up</h2><span class="n">${list.length}</span><span class="spacer"></span><span class="n">${esc(leadLabel(defLead()))} ahead</span></div>
    <div class="card">${list.map(t => taskRowOnly(t, 'due')).join('')}</div></div>`;
}
function renderPicker(D){
  const isToday = D === today(), label = isToday ? 'Today' : DOW[(parse(D).getDay()+6)%7];
  const q = UI.pickQ.trim().toLowerCase();
  const cand = tasks().filter(t => isOpen(t) && (effDay(t) !== D || stepsOf(t).some(c => !c.done && sDay(c) !== D)) && !(effDay(t) === D));
  const match = t => !q || (t.title + ' ' + projLabel(t) + ' ' + (taskCat(t)?.name || '') + ' ' + (msById(t)?.name || '')).toLowerCase().includes(q);
  const used = new Set();
  const pickSteps = t => { const ss = stepsOf(t).filter(c => !c.done && sDay(c) !== D); return ss.length ? `<div class="steps">${ss.map(c => `<div class="step"><button class="schk" data-act="step-toggle" data-id="${t.id}" data-s="${c.id}" aria-label="Mark step done"></button><div class="st-main" data-act="open" data-id="${t.id}"><span class="st-text">${esc(c.text)}</span></div><button class="q add" data-act="step-day" data-id="${t.id}" data-s="${c.id}">+ ${label}</button></div>`).join('')}</div>` : ''; };
  const row = (t, flat) => `<div class="pk ${flat?'flat':''}"><div class="t-main"><div class="t-title" data-act="open" data-id="${t.id}">${esc(t.title)}</div><div class="chips" data-act="open" data-id="${t.id}">${chipsFor(t, flat ? 'pick' : 'proj')}</div>${pickSteps(t)}</div>${effDay(t) === D ? '' : `<button class="q add" data-act="pick" data-id="${t.id}">+ ${label}</button>`}</div>`;

  let h = `<div class="sec-h" style="margin-top:0"><h2>Pick for ${isToday ? 'today' : label}</h2><span class="n">from your projects and goals</span></div>
    <div class="card"><input class="pk-search" id="pick-q" placeholder="Search tasks, projects, goals…" value="${esc(UI.pickQ)}" autocomplete="off">`;

  const attn = cand.filter(t => match(t) && pingDue(t));
  attn.forEach(t => used.add(t.id));
  if (attn.length) h += `<div class="pk-sec"><div class="pk-h">Needs a ping<span class="n">${attn.length}</span></div>${sortTasks(attn).map(t => row(t, true)).join('')}</div>`;

  const wk = cand.filter(t => match(t) && !used.has(t.id) && effWeek(t) === weekOf(D));
  wk.forEach(t => used.add(t.id));
  const wkSteps = allSteps().filter(({t,c}) => !c.done && isOpen(t) && sWeek(c) === weekOf(D) && sDay(c) !== D && !used.has(t.id) && (!q || (c.text + ' ' + t.title + ' ' + projLabel(t)).toLowerCase().includes(q)));
  if (wk.length || wkSteps.length) h += `<div class="pk-sec"><div class="pk-h">On this week’s list<span class="n">${wk.length + wkSteps.length}</span></div>${sortTasks(wk).map(t => row(t, true)).join('')}${wkSteps.map(({t,c}) => `<div class="pk flat"><div class="t-main" data-act="open" data-id="${t.id}"><div class="t-title">${esc(c.text)}</div><div class="st-ctx">↳ ${esc(t.title)}${projById(t.project) ? ', ' + esc(projById(t.project).name) : ''}</div></div><button class="q add" data-act="step-day" data-id="${t.id}" data-s="${c.id}">+ ${label}</button></div>`).join('')}</div>`;

  let body = '';
  for (const c of cats()){
    for (const p of projs().filter(p => p.cat === c.id && !p.archived)){
      const pts = cand.filter(t => t.project === p.id && match(t) && !used.has(t.id));
      if (!pts.length) continue;
      const cur = currentMs(p);
      const openIt = q || UI.openPick.has(p.id);
      body += `<button class="pk-proj" data-act="pick-toggle" data-id="${p.id}"><span class="dot" style="background:${c.color}"></span>${esc(p.name)}${cur ? `<span class="g">⚑ ${esc(cur.name)}</span>` : ''}<span class="n">${pts.length} ${openIt ? '▾' : '▸'}</span></button>`;
      if (!openIt) continue;
      for (const m of msList(p).filter(m => !m.done)){
        const g = sortTasks(pts.filter(t => t.milestone === m.id));
        if (!g.length) continue;
        body += `<div class="pk-goal ${cur && cur.id === m.id ? 'cur' : ''}">⚑ ${esc(m.name)}${cur && cur.id === m.id ? ' (current goal)' : ''}</div>` + g.map(t => row(t)).join('');
      }
      const rest = sortTasks(pts.filter(t => !msList(p).some(m => m.id === t.milestone && !m.done)));
      if (rest.length) body += (msList(p).length ? `<div class="pk-goal">Other tasks</div>` : '') + rest.map(t => row(t)).join('');
    }
    const loose = cand.filter(t => taskCat(t)?.id === c.id && !projById(t.project) && match(t) && !used.has(t.id));
    if (loose.length){
      const key = 'loose:' + c.id, openIt = q || UI.openPick.has(key);
      body += `<button class="pk-proj" data-act="pick-toggle" data-id="${key}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}<span class="g">no project</span><span class="n">${loose.length} ${openIt ? '▾' : '▸'}</span></button>`;
      if (openIt) body += sortTasks(loose).map(t => row(t)).join('');
    }
  }
  const inbox = cand.filter(t => !taskCat(t) && match(t) && !used.has(t.id));
  if (inbox.length){
    const openIt = q || UI.openPick.has('inbox');
    body += `<button class="pk-proj" data-act="pick-toggle" data-id="inbox"><span class="dot" style="background:var(--faint)"></span>Inbox<span class="n">${inbox.length} ${openIt ? '▾' : '▸'}</span></button>`;
    if (openIt) body += sortTasks(inbox).map(t => row(t)).join('');
  }
  if (body) h += `<div class="pk-sec"><div class="pk-h">By project</div>${body}</div>`;
  if (!attn.length && !wk.length && !body) h += `<div class="empty">${q ? 'No tasks match.' : 'Every open task is already on this day.'}</div>`;
  return h + `</div>`;
}

function kcard(t, showProj){
  const meta = [];
  if (showProj) meta.push(`<span class="chip proj"><i style="background:${catColor(t)}"></i>${esc(projLabel(t))}</span>`);
  if (t.status === 'doing') meta.push(`<span class="chip doing">Doing</span>`);
  if (t.status === 'waiting') meta.push(`<span class="chip wait">⏳ ${esc(t.waitingOn || 'Waiting')}</span>` + (t.pingBy ? `<span class="chip mono ${pingDue(t)?'late':''}">ping ${rel(t.pingBy)}</span>` : ''));
  if (t.due && isOpen(t)){ const n = dayDiff(today(), t.due); meta.push(`<span class="chip mono ${n<0?'late':n<=2?'soon':''}">due ${rel(t.due)}</span>`); }
  if (isOpen(t)){
    const d = effDay(t);
    if (d === today()) meta.push(`<span class="chip mono" style="color:var(--accent)">today</span>`);
    else if (d) meta.push(`<span class="chip mono">${rel(d)}</span>`);
    else if (effWeek(t) === curWeek()) meta.push(`<span class="chip mono">this week</span>`);
    const sToday = stepsOf(t).filter(c => !c.done && sDay(c) === today()).length;
    if (sToday && d !== today()) meta.push(`<span class="chip mono" style="color:var(--accent)">${sToday} step${sToday>1?'s':''} today</span>`);
  }
  if (showProj){ const m = msById(t); if (m) meta.push(`<span class="chip ms-chip">⚑ ${esc(m.name)}</span>`); }
  const st = stepsOf(t), sd = st.filter(c => c.done).length;
  return `<div class="kcard s-${t.status}" draggable="true" data-drag="${t.id}">
    <button class="chk ${t.status}" data-act="done" data-id="${t.id}" aria-label="Toggle done">${t.status==='done'?'✓':''}</button>
    <div class="kc-main" data-act="open" data-id="${t.id}">
      <div class="kc-title">${esc(t.title)}</div>
      <div class="kc-meta">${meta.join('')}</div>
      ${st.length ? `<div class="kc-steps"><span class="ms-bar"><i style="width:${Math.round(100*sd/st.length)}%"></i></span>${sd}/${st.length} steps</div>` : ''}
    </div>
  </div>`;
}
function renderBoard(){

  let h = `<div class="head"><h1>Board</h1></div>
    <div class="bd-bar">

    </div>

  if (UI.boardMode === 'status'){
    const inScope = t => !UI.boardCat || taskCat(t)?.id === UI.boardCat;

      sortTasks(list);
      h += `<div class="kcol wide"><div class="kcol-h"><div class="kcol-t">${label}<span class="n">${list.length}</span></div></div>
        <div class="kcol-b kzone" data-drop-status="${k}">${list.length ? list.map(t => kcard(t, true)).join('') : `<div class="kempty">Drop a card here</div>`}</div></div>`;
    }
    return h + `</div></div>`;
  }

  for (const c of catsShown){
    let cols = '';
    for (const p of projs().filter(p => p.cat === c.id && !p.archived)){
      const open = all.filter(t => t.project === p.id && isOpen(t));
      const mss = msList(p).filter(m => !m.done);
      const cur = currentMs(p), cs = cur ? msStats(p, cur) : null;

      for (const m of mss){

        const isCur = cur && cur.id === m.id;
        body += `<div class="kgoal ${isCur?'cur':''}">⚑ ${esc(m.name)}<span class="n">${g.length}</span></div>
          <div class="kzone" data-drop-kms="${p.id}|${m.id}">${g.map(t => kcard(t)).join('') || `<div class="kempty">No open tasks</div>`}</div>`;
      }
      const rest = sortTasks(open.filter(t => !mss.some(m => m.id === t.milestone)));
      if (mss.length) body += `<div class="kgoal">Other tasks<span class="n">${rest.length}</span></div>`;
      body += `<div class="kzone" data-drop-kms="${p.id}|">${rest.map(t => kcard(t)).join('') || (mss.length ? '<div class="kempty">None</div>' : '')}</div>`;
      cols += `<div class="kcol"><div class="kcol-h">
          <div class="kcol-t"><span class="nm" data-act="nav" data-v="proj" data-id="${p.id}">${esc(p.name)}</span><span class="n">${open.length}</span></div>
          ${cur ? `<div class="kcol-g"><span class="ms-bar"><i style="width:${cs.total?Math.round(100*cs.done/cs.total):0}%"></i></span><b title="${esc(cur.name)}">⚑ ${esc(cur.name)}</b></div>` : ''}
        </div>
        <div class="kcol-b">${body}<input class="kc-add" id="kadd-${p.id}" data-kadd="${p.id}" data-ms="${cur ? cur.id : ''}" placeholder="+ Add task${cur ? ' to current goal' : ''}"></div></div>`;
    }
    const loose = sortTasks(all.filter(t => isOpen(t) && taskCat(t)?.id === c.id && !projById(t.project)));
    if (loose.length) cols += `<div class="kcol"><div class="kcol-h"><div class="kcol-t">No project<span class="n">${loose.length}</span></div></div>
      <div class="kcol-b kzone" data-drop-kms="c:${c.id}|">${loose.map(t => kcard(t)).join('')}</div></div>`;
    if (!cols) cols = `<div class="kcol"><div class="kcol-b"><div class="kempty">No projects yet. Add one from the sidebar.</div></div></div>`;
    h += `<div class="kcat"><div class="kcat-h"><i style="background:${c.color}"></i>${esc(c.name)}</div><div class="kcols">${cols}</div></div>`;
  }
  const inbox = sortTasks(all.filter(t => isOpen(t) && !taskCat(t)));
  if (!UI.boardCat && inbox.length) h += `<div class="kcat"><div class="kcat-h"><i style="background:var(--faint)"></i>Inbox</div><div class="kcols"><div class="kcol"><div class="kcol-b">${inbox.map(t => kcard(t)).join('')}</div></div></div></div>`;
  return h + `</div></div>`;
}

function deadlineSettings(){
  const a = calAlerts(), n = tasks().filter(t => isOpen(t) && t.due).length;

function icsEsc(s){ return String(s ?? '').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1'); }
function icsFold(line){
  const enc = new TextEncoder(), out = []; let cur = '', len = 0;
  for (const ch of line){ const b = enc.encode(ch).length; if (len + b > 74){ out.push(cur); cur = ' '; len = 1; } cur += ch; len += b; }
  out.push(cur); return out.join('\r\n');
}
function buildIcs(list){
  const a = calAlerts(), [hh, mm] = (M.meta?.calTime || '09:00').split(':').map(Number), mins = (hh||0)*60 + (mm||0);
  const stampNow = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const url = location.origin + location.pathname;
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Todo List//Deadlines//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Todo deadlines'];
  const say = n => n === 0 ? 'Due today' : n === 1 ? 'Due tomorrow' : 'Due in ' + leadLabel(n);
  for (const t of list){
    L.push('BEGIN:VEVENT', 'UID:' + t.id + '@todo-list', 'DTSTAMP:' + stampNow,
      'DTSTART;VALUE=DATE:' + t.due.replace(/-/g,''), 'DTEND;VALUE=DATE:' + addDays(t.due, 1).replace(/-/g,''),
      'SUMMARY:' + icsEsc('Due: ' + t.title), 'DESCRIPTION:' + icsEsc(projLabel(t) + '\n' + url), 'URL:' + url, 'TRANSP:TRANSPARENT');
    const days = new Set();
    if (a.start) days.add(leadOf(t)); if (a.week) days.add(7); if (a.day) days.add(1); if (a.on) days.add(0);
    for (const n of [...days].sort((x,y) => y - x)){
      const off = n * 1440 - mins;
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(say(n) + ': ' + t.title), 'TRIGGER:' + (off > 0 ? '-PT' + off + 'M' : 'PT' + (-off) + 'M'), 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

function renderLog(){
  const all = tasks();
  const keys = new Set([curWeek()]);
  all.forEach(t => { if (t.doneDate) keys.add(weekOf(t.doneDate)); stepsOf(t).forEach(c => { if (c.doneDate) keys.add(weekOf(c.doneDate)); }); });
  M.weeks.forEach(w => { if (w.note && w.kind === 'week') keys.add(w.id.slice(2)); });
  const sorted = [...keys].filter(k => k <= curWeek()).sort().reverse();
  let h = `<div class="head"><h1>Weekly log</h1><span class="spacer"></span><button class="btn" data-act="backup">Back up everything (.json)</button></div><div class="sub">A record of what got done each week. Open a week to see its full plan.</div>`;
  for (const k of sorted){
    const done = all.filter(t => t.status === 'done' && t.doneDate && weekOf(t.doneDate) === k);
    const sdone = allSteps().filter(({c}) => c.done && c.doneDate && weekOf(c.doneDate) === k);
    const note = M.weeks.get('w-' + k)?.note || '';
    const counts = groupByCat(done).map(g => `<span class="chip proj"><i style="background:${g.cat.color}"></i>${esc(g.cat.name)} ${g.items.length}</span>`).join(' ');
    h += `<div class="card wk"><div class="wk-h" data-act="goto-week" data-w="${k}"><b>${weekLabel(k)}</b>${k===curWeek()?'<span class="chip">this week</span>':''}<span class="spacer"></span>${counts}<span class="chip mono">${done.length} done</span></div>
      ${note ? `<div class="wk-note">${esc(note.length > 400 ? note.slice(0,400) + '…' : note)}</div>` : ''}
      ${done.length || sdone.length ? `<div class="acc">${accList(done, sdone)}</div>` : `<div class="empty" style="padding:12px">Nothing marked done yet.</div>`}</div>`;
  }
  return h;
}

function statusSections(list, ctx){
  const groups = [['doing','Doing'],['waiting','Waiting on others'],['todo','To do']];
  let h = '';
  for (const [s,label] of groups){
    const g = sortTasks(list.filter(t => t.status === s));
    if (!g.length) continue;
    h += `<div class="grp"><div class="grp-h">${label}<span class="n">${g.length}</span></div>${g.map(t => taskRow(t, ctx)).join('')}</div>`;
  }
  return h;
}
function doneSection(list, ctx){
  const d = list.filter(t => t.status === 'done').sort((a,b) => (a.doneDate||'') < (b.doneDate||'') ? 1 : -1);

  return `<div class="sec"><div class="sec-h"><h2>Done</h2><span class="n">${d.length}</span><span class="spacer"></span><button class="btn" data-act="toggle-done">${UI.showDone?'Hide':'Show'}</button></div>

function renderProj(){
  const p = projById(UI.proj); if (!p) { UI.view='week'; return renderWeek(); }
  const c = catById(p.cat);

  const cur = currentMs(p);

  const msSel = UI.lastMs[p.id] !== undefined && (UI.lastMs[p.id] === '' || mss.some(m => m.id === UI.lastMs[p.id] && !m.done)) ? UI.lastMs[p.id] : (cur ? cur.id : '');
  const msOpts = mss.length ? `<select id="qa-ms" aria-label="Goal"><option value="">No goal</option>${mss.filter(m => !m.done).map(m => `<option value="${m.id}" ${m.id===msSel?'selected':''}>⚑ ${esc(m.name)}</option>`).join('')}</select>` : '';

    ${qa}`;

  mss.forEach((m, i) => {
    const st = msStats(p, m);
    const pct = st.total ? Math.round(100 * st.done / st.total) : 0;
    const isCur = cur && cur.id === m.id;
    const expanded = !m.done || UI.openMs.has(m.id);
    const ak = 'ms:' + m.id;
    const openT = st.list.filter(isOpen), doneT = st.list.filter(t => !isOpen(t));
    h += `<div class="card ms ${isCur?'current':''} ${m.done?'reached':''}" data-drop-ms="${m.id}">
      <div class="ms-h">
        <span class="ms-num">${m.done ? '✓' : i + 1}</span>
        <input class="ms-name" id="ms-name-${m.id}" value="${esc(m.name)}" data-ren="ms" data-id="${m.id}" aria-label="Goal name">
        ${isCur ? '<span class="ms-tag">Current goal</span>' : m.done ? `<span class="ms-tag" style="color:var(--done)">Reached ${m.doneDate ? short(m.doneDate) : ''}</span>` : ''}
        <span class="ms-prog"><span class="ms-bar"><i style="width:${pct}%"></i></span>${st.done}/${st.total}</span>
        <span class="ms-tools">
          <button class="q" data-act="ms-up" data-id="${m.id}" title="Move up" ${i===0?'disabled':''}>↑</button>
          <button class="q" data-act="ms-down" data-id="${m.id}" title="Move down" ${i===mss.length-1?'disabled':''}>↓</button>
          <button class="q ${m.done?'':'on'}" data-act="ms-done" data-id="${m.id}">${m.done ? 'Reopen' : 'Mark reached'}</button>
          <button class="q ${UI.armed===ak?'on':''}" data-act="ms-del" data-id="${m.id}" title="Delete goal; its tasks stay in the project">${UI.armed===ak ? 'Confirm' : '✕'}</button>
        </span>
      </div>`;
    if (expanded){
      h += openT.length ? statusSections(openT, 'proj') : `<div class="empty" style="padding:14px">${m.done ? 'All tasks finished.' : 'No open tasks for this goal yet. Add one below, or drag tasks here.'}</div>`;
      if (!m.done) h += `<input class="ms-qadd" id="ms-qa-${m.id}" data-kadd="${p.id}" data-ms="${m.id}" placeholder="Add a task to this goal, then press Enter" enterkeyhint="enter" autocomplete="off" aria-label="Add a task to ${esc(m.name)}">`;
      if (doneT.length){

      h += `<div class="ms-foot"><button data-act="ms-expand" data-id="${m.id}">Show ${st.total} task${st.total===1?'':'s'}</button></div>`;
    }
    h += `</div>`;
  });

  h += `<div class="ms-add"><input id="ms-new" placeholder="${mss.length ? 'Add the next goal' : 'Add a goal or milestone to group tasks into stages'}" data-enter="ms-add"><button class="btn" data-act="ms-add">Add goal</button></div>`;

  const loose = open.filter(t => !mss.some(m => m.id === t.milestone));
  h += `<div class="sec"><div class="sec-h"><h2>${mss.length ? 'Other tasks' : 'Tasks'}</h2><span class="n">${loose.length} open</span></div>

  h += doneSection(list.filter(t => !mss.some(m => m.id === t.milestone)), 'proj');
  return h;
}
