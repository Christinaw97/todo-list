      <label><span class="lbl">Notes</span><textarea class="dr-notes" id="d-notes" data-field="notes" placeholder="Notes">${esc(t.notes)}</textarea></label>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)">
        <span>Added ${short(t.created.slice(0,10))}${t.doneDate ? ', done ' + short(t.doneDate) : ''}</span>
        <button class="btn warn ${UI.armed===armKey?'armed':''}" data-act="del-task" data-id="${t.id}">${UI.armed===armKey?'Confirm delete':'Delete task'}</button>
      </div>
    </div>`;
}

/* ============ Undo: a few seconds to take back a finish, delete or move ============ */
let UNDO = null;
function undoStart(ids, withMeta){ const m = new Map(ids.map(id => [id, M.tasks.get(id) ? clone(M.tasks.get(id)) : null])); if (withMeta && M.meta) m.set('__meta', clone(M.meta)); return m; }
const sameRec = (a, b) => { const x = a ? { ...a } : null, y = b ? { ...b } : null; if (x) delete x._u; if (y) delete y._u; return JSON.stringify(x) === JSON.stringify(y); };
function offerUndo(msg, before){
  const changed = [...before].some(([id, old]) => id === '__meta' ? !sameRec(old, M.meta) : !sameRec(old, M.tasks.get(id) || null));
  if (!changed) return;
  clearTimeout(UNDO?.timer);
  UNDO = { msg, before, timer: setTimeout(() => { UNDO = null; drawUndo(); }, 7000) };
  drawUndo();
}
function doUndo(){
  if (!UNDO) return;
  const u = UNDO; clearTimeout(u.timer); UNDO = null;
  for (const [id, old] of u.before){
    if (id === '__meta'){ M.meta = old; saveMeta(); continue; }
    if (old){ delete M.deleted[id]; saveTask(clone(old)); }
    else if (M.tasks.has(id)) removeTask(id);
  }
  drawUndo(); showNote('Undone.'); render();
}
function drawUndo(){
  let bar = document.getElementById('undo-bar');
  if (!UNDO){ bar?.remove(); return; }
  if (!bar){ bar = document.createElement('div'); bar.id = 'undo-bar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }
  bar.style.bottom = document.getElementById('update-bar') ? 'calc(70px + env(safe-area-inset-bottom,0px))' : '';
  bar.innerHTML = `<span>${esc(UNDO.msg)}</span><button data-act="undo">Undo</button>`;
}
function whereNow(t){
  const d = effDay(t);
  if (t.status === 'done') return 'done';
  if (d) return d === today() ? 'today' : rel(d);
  const w = effWeek(t); if (w) return w === curWeek() ? 'this week' : 'the week of ' + short(w);
  return 'no date';
}
function setStatusUndo(t, s){
  const before = undoStart([t.id]), prev = t.spawned, was = t.status;
  setStatus(t, s);
  let msg = s === 'done' ? 'Marked “' + t.title + '” done' : was === 'done' ? 'Marked “' + t.title + '” not done' : '“' + t.title + '”: ' + STATUS_NAME[s];
  if (t.spawned && t.spawned !== prev){ before.set(t.spawned, null); const n = M.tasks.get(t.spawned), d = n && (n.day || n.due); if (d) msg += '. Next one: ' + (d === today() ? 'today' : rel(d)); }
  offerUndo(msg, before);
}
function moveUndo(id, fn){
  const t0 = M.tasks.get(id); if (!t0){ fn(); return; }
  const before = undoStart([id]); fn();
  const t = M.tasks.get(id); if (t) offerUndo('Moved “' + t.title + '” to ' + whereNow(t), before);
}

let noteText = '';
function showNote(s){ noteText = s; const n = document.getElementById('note'); if (n){ n.textContent = s; n.classList.add('show'); } }
function hideNote(){ noteText = ''; const n = document.getElementById('note'); if (n) n.classList.remove('show'); }

/* ============ Events ============ */
function toggleSide(){ const s = document.getElementById('side'); s.classList.toggle('open'); document.getElementById('scrim').classList.toggle('show', s.classList.contains('open') || !!UI.open); }
function closeOverlays(){ UI.open = null; UI.armed = null; document.getElementById('side').classList.remove('open'); render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act !== 'del-task' && act !== 'del-proj' && act !== 'del-cat' && act !== 'ms-del' && act !== 'gh-off' && act !== 'wk-move') UI.armed = null;
  switch(act){
    case 'nav':
      UI.view = el.dataset.v; UI.showDone = false; UI.open = null;
      try { if (HASH_VIEWS.includes(UI.view)) { if (location.hash !== '#' + UI.view) location.hash = UI.view; } else if (location.hash) location.hash = ''; } catch(e){}
      if (UI.view === 'add') focusCap();
      if (UI.view === 'search') setTimeout(() => document.getElementById('search-q')?.focus(), 40);
      if (UI.view === 'cat') UI.cat = id;
      if (UI.view === 'proj') UI.proj = id;
      if (UI.view === 'proj' && el.dataset.ms){
        const ms = el.dataset.ms; UI.openMs.add(ms);
        setTimeout(() => { const g = document.getElementById('goal-' + ms); if (!g) return;
          g.scrollIntoView({ block:'start', behavior:'smooth' }); g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); }, 60);
      }
      if (UI.view === 'week') UI.week = curWeek();
      if (UI.view === 'today') UI.day = today();
      document.getElementById('side').classList.remove('open');
      document.getElementById('scroll').scrollTop = 0;
      break;
    case 'collapse': UI.collapsed.has(id) ? UI.collapsed.delete(id) : UI.collapsed.add(id); lsSet('lt_collapsed', JSON.stringify([...UI.collapsed])); break;
    case 'add-cat': UI.adding = 'cat'; UI.addColor = PALETTE[cats().length % PALETTE.length]; render(); document.getElementById('side-new')?.focus(); return;
    case 'add-proj': UI.adding = id; render(); document.getElementById('side-new')?.focus(); return;
    case 'pick-color': UI.addColor = el.dataset.c; break;
    case 'side-save': sideSave(); return;
    case 'side-cancel': UI.adding = null; break;
    case 'setup': setupDefaults(); break;
    case 'qa-add': qaAdd(); return;
    case 'time': UI.editTime = el.dataset.k; render(); setTimeout(() => { const i = document.getElementById('time-edit'); if (i){ i.focus(); i.select(); } }, 30); return;
    case 'backup': backupAll(); return;
    case 'import-pick': { if (UI.view !== 'sync'){ UI.view = 'sync'; render(); } document.getElementById('import-file')?.click(); return; }
    case 'gh-connect': ghConnect(); return;
    case 'gh-sync': sync(); return;
    case 'gh-off': if (UI.armed === 'gh-off'){ lsSet(LS_GH, ''); try { localStorage.removeItem(LS_GH); } catch(e){} UI.armed = null; SYNC.state = 'idle'; } else { UI.armed = 'gh-off'; } break;
    case 'bd-mode': UI.boardMode = el.dataset.m; lsSet('lt_boardmode', UI.boardMode); break;
    case 'bd-cat': UI.boardCat = id || ''; break;
    case 'pick': moveUndo(id, () => planDay(id, UI.day)); return;
    case 'undo': doUndo(); return;
    case 'star': { const t = M.tasks.get(id); if (t){ t.star = !t.star; saveTask(t); } break; }
    case 'copy-person': copyText(personSummary(el.dataset.p), el.dataset.p + '’s summary'); return;
    case 'review': UI.review = !UI.review; break;
    case 'review-next': UI.review = false; UI.week = addDays(curWeek(), 7); document.getElementById('scroll').scrollTop = 0; break;
    case 'log-copy': { const r = logRange(); copyText(doneReport(r.from, r.to, r.label), 'the list of finished work'); return; }
    case 'log-dl': { const r = logRange(); downloadFile('finished-' + (r.from > '0000-01-01' ? r.from + '-to-' : 'to-') + r.to + '.md', doneReport(r.from, r.to, r.label), 'text/markdown'); return; }
    case 'log-week-copy': { const W = el.dataset.w; copyText(doneReport(W, addDays(W, 6), 'Week of ' + weekLabel(W)), 'that week'); return; }
    case 'unplan': moveUndo(id, () => { const t = M.tasks.get(id); if (t && blockLen(t) > 1 && UI.day < blockEnd(t)){ t.day = addDays(UI.day, 1); if (t.day >= t.dayTo) t.dayTo = ''; saveTask(t); return; } if (t){ t.dayTo = ''; t.day = ''; t.time = ''; if (!t.week || normW(t.week) < curWeek()) t.week = weekOf(UI.day); if (!hasWeek(t, normW(t.week))) t.weeks.push(t.week); saveTask(t); } }); break;
    case 'pick-toggle': UI.openPick.has(id) ? UI.openPick.delete(id) : UI.openPick.add(id); break;
    case 'day-prev': UI.day = addDays(UI.day, -1); break;
    case 'day-next': UI.day = addDays(UI.day, 1); break;
    case 'day-now': UI.day = today(); break;
    case 'goto-day': UI.view = 'today'; UI.day = el.dataset.d; try { location.hash = 'today'; } catch(e){} UI.day = el.dataset.d; document.getElementById('scroll').scrollTop = 0; break;
    case 'cap-add': capAdd(); return;
    case 'open': UI.open = id; break;
    case 'close': UI.open = null; break;
    case 'done': toggleDone(id); return;
    case 'today': moveUndo(id, () => quickToday(id)); return;
    case 'week': moveUndo(id, () => quickWeek(id)); return;
    case 'pinged': markPinged(id); return;
    case 'status': { const t = M.tasks.get(id); if (t){ setStatusUndo(t, el.dataset.s); } break; }
    case 'wk-prev': UI.week = addDays(UI.week, -7); break;
    case 'wk-next': UI.week = addDays(UI.week, 7); break;
    case 'wk-now': UI.week = curWeek(); break;
    case 'ord-reset': setDayOrder(el.dataset.d, []); break;
    case 'qa-tips': UI.qaTips = !UI.qaTips; break;
    case 'pick-more': UI.pickMore = !UI.pickMore; break;
    case 'block': { const t = M.tasks.get(id); if (t){ const s0 = effDay(t) || t.day, n = +el.dataset.n; t.day = s0; t.week = weekOf(s0); if (!hasWeek(t, t.week)) t.weeks.push(t.week); t.dayTo = n > 1 ? addDays(s0, n - 1) : ''; saveTask(t); } break; }
    case 'ping-in': { const t = M.tasks.get(id); if (t){ const n = +el.dataset.n; if (+t.pingEvery === n && t.pingBy === addDays(today(), n)){ t.pingEvery = 0; } else { t.pingEvery = n; t.pingBy = addDays(today(), n); } saveTask(t); } break; }
    case 'focus': toggleFocus(el.dataset.k, el.dataset.w); break;
    case 'focus-last': { const W = el.dataset.w; setFocus(W, focusOf(addDays(W, -7)).slice(0, FOCUS_MAX)); break; }
    case 'proj-archive': { const p = projById(id); if (p){ p.archived = true; p.archivedAt = today(); saveMeta(); showNote('Archived “' + p.name + '”. You can find it under Archived in the sidebar.'); } break; }
    case 'proj-unarchive': { const p = projById(id); if (p){ p.archived = false; p.archivedAt = ''; saveMeta(); showNote('“' + p.name + '” is back in your lists.'); } break; }
    case 'ms-checked': { const m = msList(projById(el.dataset.p)).find(x => x.id === id); if (m){ m.remind = ''; saveMeta(); showNote('Check-in for “' + m.name + '” cleared.'); } break; }
    case 'wk-move':
      if (UI.armed === 'wk-move'){ UI.armed = null; const u = unfinishedThisWeek(), before = undoStart([...new Set([...u.tasks.map(t => t.id), ...u.steps.map(x => x.t.id)])]); const n = moveUnfinishedToNextWeek(); offerUndo('Moved ' + n + ' unfinished item' + (n === 1 ? '' : 's') + ' to next week', before); }
      else UI.armed = 'wk-move';
      break;
    case 'goto-week': UI.view = 'week'; UI.week = el.dataset.w; document.getElementById('scroll').scrollTop = 0; break;
    case 'toggle-done': UI.showDone = !UI.showDone; break;
    case 'export': exportWeek(); return;
    case 'cal-all': calExport(); return;
    case 'step-pick': {
      const key = el.dataset.pre + el.dataset.s; UI.stepPick = key; render();
      setTimeout(() => { const i = document.getElementById(key); if (i){ i.focus(); try { i.showPicker(); } catch(err){} } }, 30);
      return; }
    case 'cal-one': { const t = M.tasks.get(id); if (t && effDue(t)) downloadFile('deadline-' + (t.title.replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'task') + '.ics', buildIcs([t]), 'text/calendar'); return; }
    case 'cl-toggle': { const t = M.tasks.get(UI.open); if (t){ const c = t.checklist[+el.dataset.i]; c.done = !c.done; c.doneDate = c.done ? today() : ''; saveTask(t); } break; }
    case 'step-toggle': { const x = findStep(id, el.dataset.s); if (x){ x.c.done = !x.c.done; x.c.doneDate = x.c.done ? today() : ''; saveTask(x.t); } break; }
    case 'step-day': {
      const x = findStep(id, el.dataset.s); if (!x) break;
      const D = UI.view === 'today' ? UI.day : today();
      if (sDay(x.c) === D){ x.c.day = ''; x.c.week = weekOf(D); x.c.time = ''; }
      else { x.c.day = D; x.c.week = weekOf(D); }
      saveTask(x.t); break; }
    case 'step-week': {
      const x = findStep(id, el.dataset.s); if (!x) break;
      const W = UI.view === 'week' ? UI.week : curWeek();
      if (sWeek(x.c) === W){ x.c.week = ''; x.c.day = ''; } else { x.c.week = W; x.c.day = ''; }
      saveTask(x.t); break; }
    case 'add-step': UI.open = id; render(); setTimeout(() => document.getElementById('d-cl-new')?.focus(), 60); return;
    case 'cl-del': { const t = M.tasks.get(UI.open); if (t){ t.checklist.splice(+el.dataset.i,1); saveTask(t); } break; }
    case 'del-task': if (UI.armed === 'task:'+id){ const before = undoStart([id]), nm = M.tasks.get(id)?.title || ''; removeTask(id); UI.open = null; UI.armed = null; offerUndo('Deleted “' + nm + '”', before); } else UI.armed = 'task:'+id; break;
    case 'ms-add': msAdd(); return;
    case 'ms-up': case 'ms-down': {
      const p = projById(UI.proj); const a = msList(p); const i = a.findIndex(m => m.id === id); const j = act === 'ms-up' ? i - 1 : i + 1;
      if (i >= 0 && j >= 0 && j < a.length){ [a[i], a[j]] = [a[j], a[i]]; saveMeta(); }
      break; }
    case 'ms-done': {
      const m = msList(projById(UI.proj)).find(m => m.id === id);
      if (m){ m.done = !m.done; m.doneDate = m.done ? today() : ''; UI.openMs.delete(m.id); saveMeta(); }
      break; }
    case 'ms-expand': UI.openMs.has(id) ? UI.openMs.delete(id) : UI.openMs.add(id); break;
    case 'ms-showdone': UI.openMs.has('d:'+id) ? UI.openMs.delete('d:'+id) : UI.openMs.add('d:'+id); break;
    case 'ms-del':
      if (UI.armed === 'ms:'+id){
        const p = projById(UI.proj); p.milestones = msList(p).filter(m => m.id !== id); saveMeta();
        tasks().filter(t => t.milestone === id).forEach(t => { t.milestone = ''; saveTask(t); });
        UI.armed = null;
      } else UI.armed = 'ms:'+id;
      break;
    case 'del-proj':
      if (UI.armed === 'proj:'+id){
        const before = undoStart(tasks().filter(t => t.project === id).map(t => t.id), true), nm = projById(id)?.name || '';
        tasks().filter(t => t.project === id).forEach(t => removeTask(t.id));
        setTimeout(() => offerUndo('Deleted the project “' + nm + '”', before), 0);
        M.meta.projects = projs().filter(p => p.id !== id); saveMeta();
        UI.armed = null; UI.view = 'week';
      } else UI.armed = 'proj:'+id;
      break;
    case 'del-cat':
      if (UI.armed === 'cat:'+id){
        const before = undoStart(tasks().filter(t => taskCat(t)?.id === id).map(t => t.id), true), nm = catById(id)?.name || '';
        tasks().filter(t => taskCat(t)?.id === id).forEach(t => removeTask(t.id));
        setTimeout(() => offerUndo('Deleted the category “' + nm + '”', before), 0);
        M.meta.projects = projs().filter(p => p.cat !== id);
        M.meta.categories = cats().filter(c => c.id !== id); saveMeta();
        UI.armed = null; UI.view = 'week';
      } else UI.armed = 'cat:'+id;
      break;
  }
  render();
});

document.addEventListener('keydown', e => {

    if (t.waitingOn !== v){

      t.waitingOn = v;

// Drag and drop
const DROP_SEL = '[data-ord],[data-drop],[data-drop-proj],[data-drop-ms],[data-drop-kms],[data-drop-status]';
const dragRef = el => el.dataset.drag || (el.dataset.dragStep ? 'step:' + el.dataset.dragStep : '');
// Inside an orderable list, a drop on the list itself (a gap, below the last row) means the nearest row
function refineZone(z, y){
  if (!z || z.dataset.orderDay === undefined || y == null) return z;
  const rows = [...z.querySelectorAll(':scope > [data-ord]')]; if (!rows.length) return z;
  for (const r of rows){ const b = r.getBoundingClientRect(); if (y < b.bottom) return r; }
  return rows[rows.length - 1];
}
function canDrop(z, ref){
  if (!z) return false;
  if (z.dataset.ord !== undefined) return !!ref;
  if (ref.startsWith('step:')) return z.dataset.drop !== undefined;   // steps move between days / the week list
  return true;
}
function dropOn(z, ref, y){
  if (z.dataset.ord !== undefined){
    const list = z.closest('[data-order-day]'), D = list?.dataset.orderDay; if (!D) return;
    const key = ref.startsWith('step:') ? 's:' + ref.slice(5) : 't:' + ref;
    if (z.dataset.ord === key) return;
    if (ref.startsWith('step:')){ const [tid, sid] = ref.slice(5).split('|'), x = findStep(tid, sid); if (!x) return; if (sDay(x.c) !== D){ x.c.day = D; x.c.week = weekOf(D); saveTask(x.t); } }
    else { const t = M.tasks.get(ref); if (!t || t.status === 'done') return; if (!onDay(t, D)){ setWhen(t, D); saveTask(t); } }
    const keys = [...list.querySelectorAll(':scope > [data-ord]')].map(el => el.dataset.ord).filter(k => k !== key);
    const r = z.getBoundingClientRect();
    let i = keys.indexOf(z.dataset.ord); if (i < 0) i = keys.length; else if (y != null && y > r.top + r.height / 2) i++;
    keys.splice(i, 0, key);
    setDayOrder(D, keys); render(); return;
  }
  if (ref.startsWith('step:')){
    const [tid, sid] = ref.slice(5).split('|'), x = findStep(tid, sid), d = z.dataset.drop;
    if (!x || d === undefined) return;
    if (d === 'week'){ x.c.day = ''; x.c.week = UI.week; } else { x.c.day = d; x.c.week = weekOf(d); }
    saveTask(x.t); render(); return;
  }
  const id = ref, t = M.tasks.get(id); if (!t) return;
  if (z.dataset.dropStatus){ setStatus(t, z.dataset.dropStatus); render(); return; }   // undo offered by dropUndo
  if (z.dataset.dropKms !== undefined){
    const [pid, mid] = z.dataset.dropKms.split('|');
    if (pid.startsWith('c:')){ t.project = ''; t.cat = pid.slice(2); t.milestone = ''; }
    else { t.project = pid; t.cat = projById(pid)?.cat || ''; t.milestone = mid || ''; }
    saveTask(t); render(); return;
  }
  if (z.dataset.dropMs !== undefined){ t.project = UI.proj; t.cat = projById(UI.proj)?.cat || ''; t.milestone = z.dataset.dropMs; saveTask(t); render(); return; }
  if (z.dataset.dropProj){ t.project = z.dataset.dropProj; t.cat = projById(t.project)?.cat || ''; saveTask(t); render(); return; }
  const d = z.dataset.drop;
  if (t.status === 'done' && d !== 'week') return;
  planDay(id, d);
}
function dropUndo(z, ref, y){
  const id = ref.startsWith('step:') ? ref.slice(5).split('|')[0] : ref, t0 = M.tasks.get(id);
  if (!t0){ dropOn(z, ref, y); return; }
  const before = undoStart([id]), st = t0.status;
  dropOn(z, ref, y);
  const t = M.tasks.get(id); if (!t) return;
  if (t.spawned && t.spawned !== before.get(id).spawned) before.set(t.spawned, null);
  offerUndo(t.status !== st ? '“' + t.title + '”: ' + STATUS_NAME[t.status] : ref.startsWith('step:') ? 'Moved a step of “' + t.title + '”' : 'Moved “' + t.title + '” to ' + whereNow(t), before);
}
const clearHints = () => document.querySelectorAll('.drop-hint,.ins-before,.ins-after').forEach(x => x.classList.remove('drop-hint','ins-before','ins-after'));
function markZone(z, y){
  clearHints();
  if (z.dataset.ord !== undefined){ const r = z.getBoundingClientRect(); z.classList.add(y < r.top + r.height / 2 ? 'ins-before' : 'ins-after'); }
  else z.classList.add('drop-hint');
}
let dragNow = '';
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-drag],[data-drag-step]'); if (!el) return;
  dragNow = dragRef(el);
  e.dataTransfer.setData('text/plain', dragNow); e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging');
});
document.addEventListener('dragend', e => { e.target.closest?.('[data-drag],[data-drag-step]')?.classList.remove('dragging'); clearHints(); dragNow = ''; });
document.addEventListener('dragover', e => {
  const z = refineZone(e.target.closest?.(DROP_SEL), e.clientY); if (!z || !canDrop(z, dragNow)) return;
  e.preventDefault(); markZone(z, e.clientY);
});
document.addEventListener('drop', e => {
  const z = refineZone(e.target.closest?.(DROP_SEL), e.clientY); if (!z) return;
  e.preventDefault(); clearHints();
  const ref = e.dataTransfer.getData('text/plain') || dragNow; dragNow = '';
  if (ref && canDrop(z, ref)) dropUndo(z, ref, e.clientY);
});

/* Touch: press and hold a task or step, then drag it (phones and tablets) */
const IS_TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
let TD = null, touchDropAt = 0;
function tdEnd(){
  if (!TD) return;
  clearTimeout(TD.timer); cancelAnimationFrame(TD.raf);
  TD.ghost?.remove(); TD.el.classList.remove('dragging'); clearHints();
  TD = null;
}
function tdZone(){
  const under = document.elementFromPoint(TD.x, TD.y);
  const z = refineZone(under?.closest(DROP_SEL), TD.y);
  TD.zone = z && canDrop(z, TD.ref) ? z : null;
  if (TD.zone) markZone(TD.zone, TD.y); else clearHints();
}
function tdFrame(){
  if (!TD || !TD.active) return;
  const sc = document.getElementById('scroll'), edge = 70;
  if (TD.y < edge) sc.scrollTop -= Math.ceil((edge - TD.y) / 6);
  else if (TD.y > innerHeight - edge) sc.scrollTop += Math.ceil((TD.y - innerHeight + edge) / 6);
  const hz = document.elementFromPoint(TD.x, TD.y)?.closest('.days-wrap, .board-wrap');
  if (hz){ const r = hz.getBoundingClientRect(); if (TD.x < r.left + 40) hz.scrollLeft -= 10; else if (TD.x > r.right - 40) hz.scrollLeft += 10; }
  tdZone();
  TD.raf = requestAnimationFrame(tdFrame);
}
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { tdEnd(); return; }
  const grip = e.target.closest?.('[data-grip]');
  const el = grip ? (grip.closest('[data-drag-step]') || grip.closest('.ord')?.querySelector('[data-drag]')) : e.target.closest?.('[data-drag],[data-drag-step]');
  if (!el || (!grip && e.target.closest('button,input,select,textarea,a'))) return;
  const p = e.touches[0];
  TD = { el, ref: dragRef(el), x: p.clientX, y: p.clientY, x0: p.clientX, y0: p.clientY, active: false, zone: null, grip: !!grip };
  TD.timer = setTimeout(() => {
    if (!TD) return;
    TD.active = true; el.classList.add('dragging');
    const r = el.getBoundingClientRect();
    TD.dx = TD.x - r.left; TD.dy = TD.y - r.top;
    const g = el.cloneNode(true); g.classList.remove('dragging'); g.classList.add('drag-ghost'); g.removeAttribute('data-drag'); g.removeAttribute('data-drag-step');
    g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g); TD.ghost = g;
    try { navigator.vibrate?.(12); } catch(err){}
    TD.raf = requestAnimationFrame(tdFrame);
  }, grip ? 0 : 350);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!TD) return;
  const p = e.touches[0];
  if (!TD.active){ if (TD.grip){ e.preventDefault(); return; } if (Math.hypot(p.clientX - TD.x0, p.clientY - TD.y0) > 10) tdEnd(); return; }   // it's a scroll, not a drag
  e.preventDefault();
  TD.x = p.clientX; TD.y = p.clientY;
  TD.ghost.style.left = (TD.x - TD.dx) + 'px'; TD.ghost.style.top = (TD.y - TD.dy) + 'px';
}, { passive: false });
document.addEventListener('touchend', e => {
  if (!TD) return;
  if (TD.active){ e.preventDefault(); touchDropAt = Date.now(); tdZone(); const z = TD.zone, ref = TD.ref, y = TD.y; tdEnd(); if (z) dropUndo(z, ref, y); }
  else tdEnd();
}, { passive: false });
document.addEventListener('touchcancel', tdEnd);

/* Phone: swipe right to open the sidebar, swipe left to close it */
let SWP = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || innerWidth > 780){ SWP = null; return; }
  const p = e.touches[0];
  SWP = { x: p.clientX, y: p.clientY, t: Date.now(),

document.addEventListener('touchend', e => {
  const s0 = SWP; SWP = null;

  const p = e.changedTouches[0], dx = p.clientX - s0.x, dy = p.clientY - s0.y;
  if (Date.now() - s0.t > 700 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6) return;

/* ============ Action helpers ============ */
function qaWhen(){
  const w = document.getElementById('qa-when')?.value || 'none';
  if (w !== 'pick') return w;
  return document.getElementById('qa-date')?.value || 'pick';
}
function qaAdd(){
  const inp = document.getElementById('qa-text'); const v = inp?.value.trim(); if (!v) return;
  const target = document.getElementById('qa-target')?.value || '';
  let when = qaWhen();
  if (when === 'pick'){ const di = document.getElementById('qa-date'); if (di){ di.hidden = false; di.focus(); } showNote('Choose a date first, or pick another option.'); return; }
  if (UI.view === 'week' && UI.week < curWeek()) when = 'none';
  UI.lastProj = target; lsSet('lt_lastproj', target);
  const ms = document.getElementById('qa-ms')?.value || '';
  if (UI.view === 'proj') { UI.lastMs[UI.proj] = ms; }
  const nt = addParsed(v, target, when, ms && target === 'p:' + UI.proj ? { milestone: ms } : null);
  inp.value = '';
  render();
  const landed = nt.project ? 'p:' + nt.project : nt.cat ? 'c:' + nt.cat : '';
  if (landed !== target) showNote('Added “' + nt.title + '” to ' + projLabel(nt) + ', because the text mentions it.');
  document.getElementById('qa-text')?.focus();
}
function normTime(v){
  v = v.trim(); if (!v) return '';
  const bare = v.match(/^(\d{1,2})(?::(\d{2}))?$/);
  if (bare){ const h = +bare[1], m = +(bare[2] || 0); if (h <= 23 && m < 60) return fmtClock(h, m, guessAp(h)); }
  const r = extractTime(' ' + v + ' ');
  return r.time && !r.text.trim() ? r.time : v;
}
function commitTime(el){
  const key = el.dataset.tkey, v = normTime(el.value), parts = key.split(':');
  if (parts[0] === 't'){ const t = M.tasks.get(parts[1]); if (t && (t.time||'') !== v){ t.time = v; saveTask(t); } }
  else { const x = findStep(parts[1], parts[2]); if (x && (x.c.time||'') !== v){ x.c.time = v; saveTask(x.t); } }
}
function saveTimeEdit(el){
  if (!UI.editTime || el.dataset.tkey !== UI.editTime) return;
  commitTime(el);
  UI.editTime = null;
  render();
}
async function ghConnect(){
  const old = ghCfg() || {};
  const cfg = {
    owner: document.getElementById('gh-owner').value.trim().replace(/^@/, ''),
    repo: document.getElementById('gh-repo').value.trim(),
    token: document.getElementById('gh-token').value.trim() || old.token || '',
    branch: document.getElementById('gh-branch').value.trim() || 'main',
    path: document.getElementById('gh-path').value.trim() || 'tracker.json'
  };
  UI.ghDraft = { owner:cfg.owner, repo:cfg.repo, branch:cfg.branch, path:cfg.path };
  if (!cfg.owner || !cfg.repo || !cfg.token){ setSync('error', 'Fill in the username, repo and token.'); render(); return; }
  setSync('syncing'); render();
  try {
    await ghCheckRepo(cfg);
    lsSet(LS_GH, JSON.stringify(cfg));
    UI.ghDraft = null;
    SYNC.state = 'idle';
    await sync();
    if (SYNC.state === 'ok') showNote('Connected. This device is now synced with ' + cfg.owner + '/' + cfg.repo + '.');
  } catch(e){
    setSync('error', e instanceof TypeError ? 'Couldn’t reach GitHub. Check your connection.' : e.message);
  }
  render();
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'import-file') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const now = Date.now();
    const inc = { meta: d.meta ? { ...d.meta, _u: d.meta._u || now } : null,
      tasks: (d.tasks || []).filter(t => t && t.id).map(t => ({ ...t, _u: t._u || now })),
      notes: (d.notes || d.weeks || []).filter(n => n && n.id).map(n => ({ ...n, _u: n._u || now })),
      deleted: d.deleted || {} };
    if (M.meta && inc.meta){
      // keep categories and projects from both sides
      const cats = new Map([...(M.meta.categories||[]), ...(inc.meta.categories||[])].map(c => [c.id, c]));
      const prj = new Map([...(M.meta.projects||[]), ...(inc.meta.projects||[])].map(p => [p.id, p]));
      inc.meta = { ...M.meta, categories:[...cats.values()], projects:[...prj.values()], _u: now };
    }
    const merged = mergeStates(snapshot(), inc);
    loadState(merged); persist();
    showNote(`Imported ${inc.tasks.length} tasks and ${inc.notes.length} notes.`);
    UI.view = 'today'; render();
  } catch(err){ showNote('That file couldn’t be read as a tracker backup.'); render(); }
  e.target.value = '';
});
async function backupAll(){
  const data = { exported:new Date().toISOString(), ...snapshot() };
  const text = JSON.stringify(data, null, 2);
  downloadFile(`todo-list-backup-${today()}.json`, text, 'application/json');
}
function msAdd(){
  const inp = document.getElementById('ms-new'); const v = inp?.value.trim(); if (!v) return;
  const p = projById(UI.proj); if (!p) return;
  p.milestones = [...msList(p), { id:uid('m'), name:v, done:false, doneDate:'' }];
  saveMeta(); inp.value = ''; render(); document.getElementById('ms-new')?.focus();
}
function capAdd(){
  const el = document.getElementById('cap-text'); if (!el) return;
  const lines = splitLines(el.value); if (!lines.length) return;
  const added = lines.map(l => addParsed(l, '', 'today'));
  UI.recent = [...added.map(t => t.id), ...UI.recent].slice(0, 12);
  el.value = '';
  render(); focusCap();
}
function sideSave(){
  const v = document.getElementById('side-new')?.value.trim(); if (!v) return;
  if (!M.meta) M.meta = { kind:'meta', categories:[], projects:[] };
  if (UI.adding === 'cat'){
    const c = { id:uid('c'), name:v, color:UI.addColor };
    M.meta.categories.push(c); UI.view = 'cat'; UI.cat = c.id;
  } else {
    const p = { id:uid('p'), cat:UI.adding, name:v, archived:false };
    M.meta.projects.push(p); UI.view = 'proj'; UI.proj = p.id;
  }
  UI.adding = null; saveMeta(); render();
}
function clAdd(){
  const inp = document.getElementById('d-cl-new'); const v = inp?.value.trim(); if (!v) return;
  const t = M.tasks.get(UI.open); if (!t) return;
  t.checklist.push({ id:uid('k'), text:v, done:false, doneDate:'', day:'', week:'' }); saveTask(t);
  inp.value = ''; render(); document.getElementById('d-cl-new')?.focus();
}
function setupDefaults(){
  M.meta = { kind:'meta', categories:[ {id:uid('c'),name:'Research',color:'#0e9f8e'}, {id:uid('c'),name:'Misc',color:'#c27c0e'} ], projects:[] };
  saveMeta();
}
async function exportWeek(){
  const W = UI.week, all = tasks();
  const done = all.filter(t => t.status === 'done' && t.doneDate && weekOf(t.doneDate) === W);
  const open = all.filter(t => isOpen(t) && effWeek(t) === W);
  const waiting = open.filter(t => t.status === 'waiting');
  let md = `# Week of ${weekLabel(W)}\n\n## Accomplished\n`;
  for (const g of groupByCat(done)){ md += `\n### ${g.cat.name}\n` + g.items.map(t => `- ${t.title}${projById(t.project) ? ' (' + projById(t.project).name + ')' : ''}`).join('\n') + '\n'; }
  const sdone = allSteps().filter(({c}) => c.done && c.doneDate && weekOf(c.doneDate) === W);
  if (sdone.length) md += `\n### Steps finished\n` + sdone.map(({t,c}) => `- ${c.text} (${t.title})`).join('\n') + '\n';
  if (!done.length && !sdone.length) md += '\nNothing marked done.\n';
  md += `\n## Still open\n`;
  for (const g of groupByCat(open.filter(t => t.status !== 'waiting'))){ md += `\n### ${g.cat.name}\n` + g.items.map(t => `- ${t.title}`).join('\n') + '\n'; }
  if (waiting.length) md += `\n## Waiting on others\n` + waiting.map(t => `- ${t.title}${t.waitingOn ? ', waiting on ' + t.waitingOn : ''}`).join('\n') + '\n';
  const note = weekNote(W)?.note; if (note) md += `\n## Notes\n\n${note}\n`;
  downloadFile(`week-${W}.md`, md, 'text/markdown');
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && ready) render(); });

if (UI.view === 'add'){ render(); focusCap(); }
initStore();
document.addEventListener('visibilitychange', () => { if (!document.hidden && ghCfg()) scheduleSync(200); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
// Home-screen apps on iPhone often resume instead of reloading, so check for a newer version when the app comes back
let updateShown = false;
function checkForUpdate(){
  if (updateShown || !location.protocol.startsWith('http')) return;
  fetch('sw.js?check=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    const m = t.match(/VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION && !updateShown){
      updateShown = true;
      const bar = document.createElement('div');
      bar.id = 'update-bar';
      bar.innerHTML = 'A new version is ready. <button class="btn pri" id="update-now">Update</button>';
      document.body.appendChild(bar);
      document.getElementById('update-now').onclick = () => location.reload();
    }
  }).catch(() => {});
}
setTimeout(checkForUpdate, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
setInterval(checkForUpdate, 30 * 60 * 1000);
